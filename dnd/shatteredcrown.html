  renderNode(m);
}
function renderNode(m){
  const n=N[S.node];let h=`<article class="card"><div class="scene-head"><div class="badge" aria-hidden="true">${n.i}</div><h2>${n.t}</h2></div>`;
  if(S.note)h+=`<div class="note"><span>What happened</span><p>${S.note}</p></div>`;
  h+=paras(n.x(S));
  if(n.type==='shop')h+=`<div class="shop">${SHOP.map((it,i)=>{const own=S.inv[it.k],full=it.max&&own>=it.max;
    return `<div class="item"><div><b>${it.n}${own?` <small>(you have ${own})</small>`:''}</b><small>${it.d}</small></div><button class="buy" data-buy="${i}" ${full||S.gold<it.p?'disabled':''}>${full?'Owned':it.p+' gold'}</button></div>`}).join('')}</div>`;
  const q=n.type==='riddle'?(n.q||RIDDLES[S.flags.rq]):null;
  if(q&&!(n.done&&n.done(S)))h+=`<div class="riddle"><q>${q[0]}</q><div class="opts">${S.flags.ro.map((o,i)=>`<button class="ch" data-r="${i}"><span class="arr">›</span><span class="lab">${o}</span></button>`).join('')}</div></div>`;
  if(n.type==='end'){const k=Object.values(S.kills).reduce((a,b)=>a+b,0);h+=`<div class="summary"><div><b>${S.lvl}</b><small>Level</small></div><div><b>${k}</b><small>Monsters beaten</small></div><div><b>${S.gold}</b><small>Gold</small></div></div>`}
  h+='</article>';
  cur=n.c?n.c(S).filter(c=>c.if!==false):[];
  if(cur.length){h+=`<div class="choices">${cur.map((c,i)=>{let tag='';
    if(c.check)tag=`<span class="tag chk">${c.check.st.toUpperCase()} ${c.check.dc}</span>`;else if(c.fight)tag=`<span class="tag bat">Battle</span>`;else if(c.cost)tag=`<span class="tag gold">${c.cost} gold</span>`;else if(c.tag)tag=`<span class="tag bat">${c.tag}</span>`;
    return `<button class="ch" data-c="${i}" ${c.cost&&S.gold<c.cost?'disabled':''}><span class="arr">›</span><span class="lab">${c.t}</span>${tag}</button>`}).join('')}</div>`;
    const hint=cur.find(c=>c.hint);if(hint)h+=`<div class="hint">${hint.hint}</div>`}
  if(n.type==='end')h+=`<div class="choices"><button class="big" id="again">Play again with a new hero</button></div><p class="hint">Can you win with all six classes? Try a different path too. There are secrets you haven't found yet.</p>`;
  m.innerHTML=h;
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>choose(+b.dataset.c));
  m.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=SHOP[+b.dataset.buy];if(S.gold<it.p)return;S.gold-=it.p;S.inv[it.k]++;S.note=`You bought: ${it.n}.`;save();render()});
  m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const ok=S.flags.ro[+b.dataset.r]===q[1];go(ok?n.ok:n.bad,ok?'':`The answer was: ${q[1]}.`)});
  if($('#again'))$('#again').onclick=()=>{S=null;screen='create';render()};
}
function renderCombat(m){
  const f=C.m,c=cls(),sp=c.sp,w=c.wpn,d=busy;
  const spOff=d||S.uses<1||(sp.k==='mark'&&C.mark)||(sp.k==='bear'&&C.bear);
  let h=`<article class="card"><div class="foe" id="foe"><div class="foe-ico" aria-hidden="true">${f.i}</div><h2>${f.n}</h2>
   <div class="track"><i style="width:${Math.max(0,f.hp)/f.max*100}%"></i></div><div class="foe-meta"><span>${Math.max(0,f.hp)} / ${f.max} HP</span><span>Armor ${f.ac}</span><span>Round ${C.round}</span></div>
   ${C.mark||C.bear?`<div class="status">${C.mark?'<span>Marked</span>':''}${C.bear?'<span>You are a bear</span>':''}</div>`:''}</div>
   <div class="acts">`;
  if(S.flags.lantern&&f.lantern&&!C.lan)h+=`<button class="act lan" id="aL" ${d?'disabled':''}><b>${GAME.relic.btn}</b><small>${GAME.relic.desc}</small></button>`;
  h+=`<button class="act main" id="aA" ${d?'disabled':''}><b>Attack: ${C.bear?'Bear Claws':wpnName()}</b><small>d20 ${sign(toHit())} to hit · ${w.c}d${w.d}${sign(dmgB())} damage${C.mark?' +1d6':''}</small></button>
   <button class="act" id="aS" ${spOff?'disabled':''}><b>${sp.n}</b><small>${sp.d} · ${S.uses} left</small></button>
   <button class="act" id="aP" ${d||S.inv.potion<1||S.hp>=S.max?'disabled':''}><b>Healing Potion</b><small>Heal 2d4+2 · ${S.inv.potion} left</small></button>
   ${S.race==='dragonborn'?`<button class="act" id="aB" ${d||C.breathUsed?'disabled':''}><b>Dragon Breath</b><small>2d6${sign(S.lvl)} fire damage · ${C.breathUsed?'used':'once per fight'}</small></button>`:''}
   <button class="act" id="aR" ${d||f.boss?'disabled':''}><b>Run away</b><small>${f.boss?'You can\'t run from a boss!':'Dexterity check, need 12'}</small></button>
   </div><div class="log" aria-live="polite">${C.log.slice(0,6).map(l=>`<div class="${l.c}">${l.t}</div>`).join('')}</div></article>`;
  m.innerHTML=h;
  if(C.hit){C.hit=false;$('#foe').classList.add('hit')}
  $('#aA').onclick=()=>attack('atk');$('#aS').onclick=special;$('#aP').onclick=potion;$('#aR').onclick=flee;
  if($('#aL'))$('#aL').onclick=relic;if($('#aB'))$('#aB').onclick=dbreath;
}
function sheet(){
  const c=cls(),items=[];if(S.inv.potion)items.push(`${S.inv.potion} Healing Potion${S.inv.potion>1?'s':''}`);if(S.inv.rope)items.push(SHOP.find(x=>x.k==='rope').n);if(S.inv.luck)items.push(GAME.luck);
  GAME.items.forEach(([f,l])=>{if(S.flags[f])items.push(l)});
  const k=Object.entries(S.kills).map(([id,n])=>`${MON[id].n}${n>1?' ×'+n:''}`).join(', ')||'None yet';
  msg(`${S.name}`,`<div style="text-align:center;color:var(--mute);font-weight:700">Level ${S.lvl} ${race().name} ${c.name} · ${S.xp} XP${S.lvl<LVMAX?` (next level at ${LV[S.lvl]})`:''}</div>
   <div class="sheet-stats">${Object.keys(STATN).map(s=>`<div><b>${sign(S.st[s])}</b><small>${s.toUpperCase()}</small></div>`).join('')}</div>
   <div class="kv"><div><span>Health</span><b>${S.hp} / ${S.max}</b></div><div><span>Armor</span><b>${S.ac}</b></div><div><span>Weapon</span><b>${wpnName()} (${c.wpn.c}d${c.wpn.d}${sign(dmgB())})</b></div>
   <div><span>${c.sp.n}</span><b>${S.uses} / ${c.sp.uses} left</b></div><div><span>${race().name} power</span><b>${race().perk}</b></div><div><span>Gold</span><b>${S.gold}</b></div><div><span>Items</span><b>${items.join(', ')||'Nothing'}</b></div>
   ${S.flags.ally?`<div><span>Companion</span><b>${GAME.ally.name}</b></div>`:''}<div><span>Monsters beaten</span><b>${k}</b></div></div>`,'Back to the adventure');
}
function renderTitle(m){
  const w=store.get(WINS)||{},sv=store.get(SAVE);
  m.innerHTML=`<div class="title"><div class="lantern" aria-hidden="true">${GAME.icon}</div><h1>${GAME.title}</h1><div class="tag-line">${GAME.tagline}</div>
   <div class="menu">${sv?`<button class="big" id="cont">Continue: ${sv.name} the ${RACES[sv.race].name} ${CL[sv.cls].name}</button><button class="ghost" id="nw">Start a new adventure</button>`:`<button class="big" id="nw">Start a new adventure</button>`}</div></div>
   <div class="trophies"><h3>Classes that beat the game</h3><div class="tro">${Object.entries(CL).map(([k,c])=>`<span class="${w[k]?'won':''}"><i>${c.i}</i>${c.name}</span>`).join('')}</div></div>
   <details><summary>How to play</summary><ul>
   <li>Read what happens, then tap a choice to decide what your hero does.</li>
   <li>Choices with a blue tag like <b>DEX 13</b> are checks. Roll a 20-sided die (d20) and add your bonus. Get 13 or more to succeed. A natural 20 always works!</li>
   <li>In battle, roll to hit. You need to match or beat the monster's Armor number.</li>
   <li>Your race gives you a special power, and your class gives you another. Try different combos!</li>
   <li>Win battles to earn XP and level up. Gold buys potions at the shop.</li>
   <li>If you fall, you'll wake up at the last safe spot. Your game saves itself as you go.</li>
   <li>Tap your hero's name at the top to see your hero sheet.</li></ul></details>`;
  $('#nw').onclick=()=>{screen='create';render()};
  if($('#cont'))$('#cont').onclick=()=>{S=sv;screen='game';S.mode='story';render()};
}
let pickC='fighter',pickR='human',pickD='normal',pickN='';
function renderCreate(m){
  const st=heroStats(pickC,pickR),hp=CL[pickC].hp+(pickR==='dwarf'?3:0);
  m.innerHTML=`<article class="card"><div class="scene-head"><div class="badge" aria-hidden="true">📜</div><h2>Create your hero</h2></div>
   <label class="f" for="hn">Hero name</label><input type="text" id="hn" maxlength="16" placeholder="Leave blank for a random name" value="${pickN}">
   <label class="f">Choose your race</label><div class="grid races">${Object.entries(RACES).map(([k,r])=>`<button class="cls ${k===pickR?'sel':''}" data-r="${k}"><span class="ci">${r.i}</span><b>${r.name}</b><small>${r.blurb}</small></button>`).join('')}</div>
   <div class="perk"><b>${RACES[pickR].name} power</b> ${RACES[pickR].perk}</div>
   <label class="f">Choose your class</label><div class="grid">${Object.entries(CL).map(([k,c])=>`<button class="cls ${k===pickC?'sel':''}" data-k="${k}"><span class="ci">${c.i}</span><b>${c.name}</b><small>${c.blurb}</small></button>`).join('')}</div>
   <div class="perk"><b>${CL[pickC].sp.n}</b> ${CL[pickC].sp.d}.</div>
   <div class="preview"><div class="pv-name">${RACES[pickR].name} ${CL[pickC].name}</div><div class="pv-st">
     <span><em>HP</em> ${hp}</span><span><em>Armor</em> ${CL[pickC].ac}</span>${Object.keys(STATN).map(s=>`<span><em>${s.toUpperCase()}</em> ${sign(st[s])}</span>`).join('')}</div></div>
   <label class="f">Difficulty</label><div class="seg"><button data-d="normal" class="${pickD==='normal'?'sel':''}">Normal<small>Real D&amp;D danger</small></button><button data-d="easy" class="${pickD==='easy'?'sel':''}">Easy<small>Weaker monsters, better aim</small></button></div>
   <div class="choices"><button class="big" id="go">Begin the adventure</button><button class="ghost" id="bk">Back</button></div></article>`;
  $('#hn').oninput=e=>pickN=e.target.value;
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{pickC=b.dataset.k;render()});
  m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{pickR=b.dataset.r;render()});
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{pickD=b.dataset.d;render()});
  $('#bk').onclick=()=>{screen='title';render()};
  $('#go').onclick=()=>{
    const n=(pickN||'').replace(/[^\p{L}\p{N} '\-]/gu,'').trim().slice(0,16)||pick(['Brannoc','Kestrel','Thorne','Zephyr','Rook','Talon','Juno','Ash','Wren','Cassius']);
    const c=CL[pickC];
    S={name:n,cls:pickC,race:pickR,diff:pickD,lvl:1,xp:0,hp,max:hp,ac:c.ac,st:heroStats(pickC,pickR),gold:20,inv:{potion:1,rope:0,luck:pickR==='halfling'?1:0},uses:c.sp.uses,flags:{},kills:{},node:GAME.start,note:'',mode:'story',cp:null};
    pickN='';screen='game';go(GAME.start);
  };
}
render();

</script>
