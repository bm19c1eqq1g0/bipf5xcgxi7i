<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Lantern of Grimmholt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one centered column (max 680px). Sticky hero bar, story card, big stacked choices, dice tray modal. Single dark theme by choice. */
:root{--bg:#121624;--panel:#1c2234;--panel2:#252d45;--line:#36405f;--ink:#f0e9d9;--mute:#a3abc6;
  --torch:#f2a93b;--torch2:#ffd889;--blood:#e2574c;--mana:#6aaff0;--leaf:#6fc583;--dieline:#6b3d10;--barbg:rgba(18,22,36,.94);--btnink:#241606;--notebg:#2b2617;--noteline:#6b5426;--selbg:#2e2a22;--lan1:#3d3218;--lan2:#2a2516;--badge:#3a3220;--glow:242,169,59;
  --f-disp:'Pirata One','Luminari','Papyrus',Georgia,serif;
  --f-body:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;min-height:100vh;
  background:radial-gradient(ellipse 90% 50% at 50% -8%, rgba(var(--glow),.16), transparent 70%),var(--bg);}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--torch2);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}

/* hero bar */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--barbg);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-in{max-width:680px;margin:0 auto;display:flex;gap:12px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.who{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:left;min-width:0}
.who .ico{font-size:22px}
.who b{display:block;font-size:15px;line-height:1.1;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--mute);font-size:12px;font-weight:700}
.vitals{flex:1;min-width:0}
.vit-row{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.track{height:10px;background:#0c0f1a;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;background:linear-gradient(90deg,#b8322a,var(--blood));transition:width .4s}
.track.xp{height:5px;margin-top:4px;border:0}
.track.xp i{background:var(--mana)}
.purse{display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.purse .g{color:var(--torch2)}
.ouch #bar{animation:ouch .45s}
@keyframes ouch{0%,100%{background:var(--barbg)}30%{background:rgba(160,40,34,.75)}}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.scene-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.badge{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 50% 40%,var(--badge),#1a1a22);border:2px solid var(--torch);box-shadow:0 0 18px rgba(var(--glow),.3)}
.scene-head h2{font-size:30px;color:var(--torch2);line-height:1.1}
.card p{margin:0 0 12px;max-width:62ch}
.card p:last-child{margin-bottom:0}
.note{background:var(--notebg);border:1px solid var(--noteline);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.note span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--torch)}
.note p{margin:2px 0 0;font-weight:600}
.lvup{margin-top:10px;padding:10px 12px;border-radius:10px;background:#1b2c40;border:1px solid var(--mana);color:#cfe6ff;font-weight:700}

.choices{display:grid;gap:10px;margin-top:16px}
.ch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:700;font-size:17px;transition:border-color .15s,transform .1s}
.ch:hover:not(:disabled){border-color:var(--torch)}
.ch:active:not(:disabled){transform:scale(.985)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.ch .arr{color:var(--torch);font-size:20px;line-height:1}
.ch .lab{flex:1;min-width:0}
.tag{flex:none;font-size:12px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.chk{color:var(--mana)} .tag.bat{color:var(--blood)} .tag.gold{color:var(--torch2)} .tag.done{color:var(--leaf)}
.hint{color:var(--mute);font-size:14px;margin-top:10px}

/* shop & riddle */
.shop{display:grid;gap:10px;margin-top:14px}
.item{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.item div{flex:1;min-width:0}
.item b{display:block}
.item small{color:var(--mute);font-size:14px}
.buy{background:var(--torch);color:var(--btnink);border:0;border-radius:10px;padding:8px 12px;font-weight:800;white-space:nowrap}
.buy:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.riddle{margin-top:14px;padding:16px;border-radius:14px;background:#151a2b;border:1px dashed var(--torch)}
.riddle q{display:block;font-family:var(--f-disp);font-size:26px;color:var(--torch2);quotes:none;line-height:1.2;margin-bottom:12px}
.riddle .opts{display:grid;gap:8px}

/* combat */
.foe{text-align:center}
.foe-ico{font-size:76px;line-height:1.1;display:inline-block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.foe.hit .foe-ico{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(10px) rotate(5deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.foe h2{font-size:30px;color:var(--torch2);margin:4px 0 10px}
.foe .track{height:14px;max-width:360px;margin:0 auto}
.foe-meta{display:flex;justify-content:center;gap:16px;margin-top:6px;font-size:14px;font-weight:800;color:var(--mute);font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.act{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-width:0}
.act b{display:block;font-size:16px}
.act small{display:block;color:var(--mute);font-size:13px;line-height:1.3;margin-top:2px}
.act.main{border-color:var(--torch);background:var(--selbg)}
.act.lan{grid-column:1/-1;border-color:var(--torch2);background:linear-gradient(90deg,var(--lan1),var(--lan2));animation:glow 1.6s infinite alternate}
@keyframes glow{to{box-shadow:0 0 22px rgba(255,216,137,.35)}}
.act:hover:not(:disabled){border-color:var(--torch2)}
.act:disabled{opacity:.4;cursor:not-allowed}
.log{margin-top:16px;display:grid;gap:6px;font-size:15px}
.log div{padding:8px 12px;border-radius:10px;background:#161b2b}
.log div:first-child{background:#20263a;font-weight:700}
.log .p{color:var(--torch2)} .log .m{color:#ff9a90} .log .a,.log .h{color:#9be3ad} .log .n{color:var(--mute)}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(6,8,14,.78);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ovbox{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:var(--panel);border:2px solid var(--torch);border-radius:20px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ovbox h3{font-size:30px;color:var(--torch2)}
.ovbox .sub{color:var(--mute);margin:4px 0 6px}
.ovbox .body{text-align:left;margin-top:10px}
.die{position:relative;width:140px;height:140px;margin:10px auto}
.die svg{width:100%;height:100%}
.die .num{position:absolute;inset:0;display:grid;place-items:center;padding-top:12px;font-family:var(--f-disp);font-size:44px;color:var(--btnink)}
.die.spin svg{animation:spin .85s cubic-bezier(.2,.7,.3,1)}
@keyframes spin{from{transform:rotate(0) scale(.7)}to{transform:rotate(720deg) scale(1)}}
.die.land{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.15)}}
.die.crit svg polygon:first-child{fill:#ffd889}
.die.crit{filter:drop-shadow(0 0 18px rgba(255,216,137,.9))}
.die.fumble svg polygon:first-child{fill:#e2574c}
.res{font-variant-numeric:tabular-nums;font-weight:700;min-height:1.5em}
.verdict{font-family:var(--f-disp);font-size:34px;line-height:1.1;min-height:1.1em;margin:4px 0}
.verdict.ok{color:var(--leaf)} .verdict.bad{color:var(--blood)} .verdict.crit{color:var(--torch2)}
.btns{display:grid;gap:8px;margin-top:14px}
.big{background:var(--torch);color:var(--btnink);border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:18px}
.big:hover{background:var(--torch2)}
.ghost{background:transparent;border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700}
.ghost:hover{border-color:var(--torch)}

/* title & creation */
.title{text-align:center;padding-block:28px 8px}
.lantern{font-size:72px;display:inline-block;animation:flick 2.4s infinite;filter:drop-shadow(0 0 26px rgba(var(--glow),.7))}
@keyframes flick{0%,100%{filter:drop-shadow(0 0 26px rgba(var(--glow),.7))}45%{filter:drop-shadow(0 0 14px rgba(var(--glow),.45))}55%{filter:drop-shadow(0 0 32px rgba(255,216,137,.8))}}
.title h1{font-size:clamp(46px,12vw,78px);line-height:.95;color:var(--torch2);text-shadow:0 4px 0 var(--dieline),0 0 30px rgba(var(--glow),.35)}
.title .tag-line{color:var(--mute);font-weight:700;margin:10px 0 22px}
.menu{display:grid;gap:10px;max-width:360px;margin:0 auto}
.trophies{margin-top:28px;text-align:center}
.trophies h3{font-family:var(--f-body);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.tro{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tro span{width:64px;padding:8px 0;border-radius:12px;border:1px dashed var(--line);font-size:12px;font-weight:800;color:var(--mute)}
.tro span i{display:block;font-style:normal;font-size:24px;filter:grayscale(1);opacity:.35}
.tro span.won{border:1px solid var(--torch);color:var(--torch2);background:var(--notebg)}
.tro span.won i{filter:none;opacity:1}
details{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
summary{font-weight:800;cursor:pointer}
details ul{margin:10px 0 0;padding-left:20px}
details li{margin-bottom:6px}
label.f{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
input[type=text]{width:100%;background:#0f1320;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:20px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cls{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.cls.sel{border-color:var(--torch);background:var(--selbg);box-shadow:0 0 0 3px rgba(var(--glow),.2)}
.cls .ci{font-size:28px}
.cls b{display:block;font-family:var(--f-disp);font-weight:400;font-size:24px;color:var(--torch2);line-height:1.1}
.cls small{display:block;color:var(--mute);font-size:13px;line-height:1.35;margin-top:2px}
.cls .st{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.cls .st em{font-style:normal;color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px;font-weight:700;text-align:left}
.seg button small{display:block;color:var(--mute);font-weight:600;font-size:13px}
.seg button.sel{border-color:var(--torch);background:var(--selbg)}
.sheet-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.sheet-stats div{background:var(--panel2);border-radius:10px;padding:8px 4px;text-align:center}
.sheet-stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sheet-stats small{font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.08em}
.kv{display:grid;gap:6px;font-size:15px}
.kv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.kv span{color:var(--mute)}
.kv b{text-align:right}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.summary div{background:var(--panel2);border-radius:12px;padding:10px 6px;text-align:center}
.summary b{display:block;font-size:24px;color:var(--torch2);font-variant-numeric:tabular-nums}
.summary small{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
@media (max-width:420px){.acts{grid-template-columns:1fr}.scene-head h2{font-size:26px}.sheet-stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr}}
.perk{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px dashed var(--line);font-size:15px}
.perk b{color:var(--torch2);margin-right:4px}
.preview{margin-top:18px;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--torch)}
.pv-name{font-family:var(--f-disp);font-size:26px;color:var(--torch2);line-height:1.1}
.pv-st{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-weight:800;font-variant-numeric:tabular-nums}
.pv-st em{font-style:normal;color:var(--mute);font-size:12px;margin-right:3px}
.status{display:flex;justify-content:center;gap:8px;margin-top:8px}
.status span{font-size:12px;font-weight:800;letter-spacing:.05em;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--mana);color:var(--mana)}
.thp{color:var(--mana)}
.who small{white-space:nowrap}
</style>
</head>
<body>
<header id="bar" hidden></header>
<main class="wrap" id="main"></main>
<div class="ov" id="ov" hidden><div class="ovbox" id="ovbox"></div></div>
<script>
const GAME={key:'grimmholt',title:'The Lantern of Grimmholt',tagline:'A Dungeons &amp; Dragons-style adventure. Roll the dice. Choose your path.',icon:'🏮',start:'tavern',silver:'Silver',luck:'Lucky Rabbit\'s Foot',
 relic:{btn:'Raise the Lantern of Dawn',desc:'3d8+2 radiant damage. Shadows hate it! Once per fight.',log:'You hold the Lantern of Dawn high. It blazes like a sunrise!'},
 ally:{name:'Tilly the halfling',lines:['Tilly zings a slingshot stone: {d} damage!','Tilly yells "TAKE THAT!" and fires: {d} damage!','Tilly bonks it right on the nose: {d} damage!']},
 items:[['key','Iron Skull Key'],['amulet','Amulet of Dawn (+1 Armor)'],['lantern','Lantern of Dawn']]};
const MON={
  rat:{n:'Giant Rat',i:'🐀',hp:7,ac:11,atk:3,dmg:[1,4,1],xp:25,gold:2,v:'bites',intro:'A rat the size of a dog squeaks angrily and charges!',bye:'The giant rat squeaks off into a crack in the wall.'},
  skel:{n:'Skeleton',i:'💀',hp:12,ac:13,atk:4,dmg:[1,6,2],xp:50,gold:5,v:'swings a rusty sword at',intro:'A pile of bones rattles together into a grinning skeleton!',bye:'The skeleton clatters into a heap of bones. Something shiny falls out of its ribs.'},
  slime:{n:'Green Slime',i:'🟢',hp:14,ac:8,atk:3,dmg:[1,8,0],xp:40,gold:4,v:'splorts onto',intro:'A wobbling blob of green goo slurps toward you. Gross.',bye:'The slime pops like a giant bubble. You are now slightly sticky.'},
  wolf:{n:'Gray Wolf',i:'🐺',hp:11,ac:13,atk:4,dmg:[2,4,0],xp:50,gold:0,v:'snaps at',intro:'The wolf circles you, teeth bared.',bye:'The wolf yelps and limps off into the trees.'},
  goblin:{n:'Goblin Guard',i:'👺',hp:9,ac:13,atk:4,dmg:[1,6,1],xp:50,gold:6,v:'jabs his spear at',intro:'"INTRUDER!" the goblin squeals, grabbing his spear.',bye:'The goblin drops his spear and runs off crying for his mom.'},
  gang:{n:'Goblin Gang',i:'👺',hp:20,ac:12,atk:4,dmg:[1,6,2],xp:100,gold:8,v:'all pile onto',intro:'Three goblins leap up, waving spoons, forks and one frying pan!',bye:'The goblins tumble over each other and flee down a side tunnel.'},
  troll:{n:'Gorp the Troll',i:'👹',hp:24,ac:13,atk:5,dmg:[1,8,2],xp:150,gold:20,v:'swings his big club at',intro:'"Gorp SMASH!" The bridge trembles as Gorp lifts his club.',bye:'Gorp sits down with a thud. "Okay okay! You win! Gorp go sulk now." He leaves behind his toll money.'},
  mimic:{n:'Mimic',i:'🧰',hp:22,ac:12,atk:5,dmg:[1,8,2],xp:120,gold:0,v:'chomps at',intro:'The chest sprouts a long purple tongue and a mouth full of teeth!',bye:'The mimic shudders, burps, and goes still. It is just a box now.'},
  king:{n:'Goblin King Grubnuk',i:'👑',hp:26,ac:14,atk:5,dmg:[2,6,1],xp:200,gold:0,boss:1,v:'whacks you with his plunger scepter',intro:'Grubnuk leaps off his throne, waving a toilet plunger like a royal scepter!',bye:'Grubnuk squeals "NOT FAIR!" and runs out a back tunnel, dropping the Lantern.'},
  dragon:{n:'Nyxathar the Shadow Drake',i:'🐉',hp:40,ac:14,atk:6,dmg:[2,6,2],xp:400,gold:0,boss:1,lantern:1,breath:1,bt:'Nyxathar breathes a wave of shadow fire!',tele:'Nyxathar takes a deep, rumbling breath... something big is coming!',v:'rakes its shadowy claws at',intro:'Nyxathar spreads wings of living darkness and roars!',bye:'Nyxathar shrieks as the golden light pours over it, and the dragon of shadow melts away like morning fog.'},
};
const MINOR=['rat','skel','slime'];
const RIDDLES=[
  ['What has keys but can\'t open a single lock?','A piano',['A jail guard','A treasure map']],
  ['What gets wetter the more it dries?','A towel',['A sponge','The ocean']],
  ['What has a head and a tail, but no body?','A coin',['A snake','A comet']],
  ['What has lots of teeth but never bites?','A comb',['A shark','A goblin']],
  ['The more of them you take, the more you leave behind. What are they?','Footsteps',['Cookies','Photos']],
  ['What has one eye but can\'t see?','A needle',['A cyclops','A pirate']],
  ['What goes up but never comes down?','Your age',['A balloon','A rocket']],
  ['What can you catch but never throw?','A cold',['A ball','A fish']],
  ['What has hands but can\'t clap?','A clock',['A statue','A glove']],
  ['I\'m tall when I\'m young and short when I\'m old. What am I?','A candle',['A tree','A wizard']],
  ['What runs but never walks, and has a bed but never sleeps?','A river',['A dog','A road']],
];
const SHOP=[
  {k:'potion',n:'Healing Potion',d:'Heals 2d4+2 HP. Works in battle too.',p:10},
  {k:'rope',n:'Coil of Rope',d:'Fifty feet of strong rope. Handy for climbing.',p:5,max:1},
  {k:'luck',n:'Lucky Rabbit\'s Foot',d:'Reroll one failed check. Used up after.',p:12,max:1},
];

const N={
tavern:{t:'The Sleeping Griffin',i:'🍺',cp:1,en:s=>s.flags.tv=(s.flags.tv||0)+1,
  x:s=>s.flags.tv>1?`The tavern is warm and noisy. Elder Mara gives you a firm nod from her corner table.\n\n"The Lantern won't rescue itself, ${s.name}."`
  :`Rain drums on the roof of the Sleeping Griffin, the coziest tavern in the village of Brackenford. Elder Mara, who is nearly a hundred years old and still wins every arm-wrestling contest, slides into the seat across from you.\n\n"${s.name}, we need a hero. Three nights ago, goblins stole the Lantern of Dawn from the village square. Its magic light is the only thing that keeps the night creatures away. The goblins took it to the caves under Grimmholt Hill."\n\nShe taps the table. "Bring it back, and Brackenford will pay you 100 gold. Every night it's gone, the shadows creep a little closer."`,
  c:s=>[{t:'Ask Bram the barkeep about Grimmholt',if:!s.flags.rumors,go:'rumors'},{t:'Visit Old Pip\'s shop',go:'shop'},{t:'Set out for Grimmholt Hill',go:'crossroads'}]},
rumors:{t:'Bram the Barkeep',i:'🗣️',en:s=>s.flags.rumors=1,
  x:s=>`Bram polishes a mug that will never, ever be clean. "Grimmholt? Here's what I know."\n\n"One: goblins aren't clever enough to plan a heist like that. Somebody smarter is giving the orders."\n\n"Two: those caves are full of holes and cliffs. A rope could save your neck."\n\n"Three: if you take the river road, Gorp the troll guards Mossback Bridge. He loves riddles. And he is VERY proud of his hair."`,
  c:s=>[{t:'Thank Bram and head back to your table',go:'tavern'}]},
shop:{t:'Old Pip\'s Odds & Ends',i:'🧪',type:'shop',
  x:s=>`A tiny gnome peeks over a counter piled with jars, boots, maps, and one very suspicious stuffed owl. "Welcome, welcome! Old Pip has just what a hero needs!"`,
  c:s=>[{t:'Back to the tavern',go:'tavern'}]},
crossroads:{t:'The Crooked Signpost',i:'🪧',
  x:s=>`The road out of Brackenford splits at a crooked signpost. Someone has drawn a skull on it, which is not encouraging.\n\nThe left arrow says WHISPERWOOD. The forest path is shorter, but you can hear howling.\n\nThe right arrow says RIVER ROAD: MOSSBACK BRIDGE. Underneath, in messier letters, someone has scribbled: TOLL!!!`,
  c:s=>[{t:'Take the forest path into Whisperwood',go:'forest'},{t:'Take the river road to Mossback Bridge',go:'river'}]},
forest:{t:'Whisperwood',i:'🌲',
  x:s=>`The trees of Whisperwood twist together overhead and block out the sky. Twigs snap. Two yellow eyes glow in the bushes, and then a big gray wolf steps onto the path, growling.\n\nIt looks hungry. Very hungry.`,
  c:s=>[{t:'Draw your weapon and fight!',fight:'wolf',win:'cabin'},
    {t:'Roar and make yourself look huge',check:{st:'str',dc:12,pass:{go:'cabin',note:'You roar like a bear and wave your arms. The wolf yelps and bolts into the trees. Great roar!'},fail:{fight:'wolf',win:'cabin',note:'You roar. The wolf tilts its head. It is not impressed.'}}},
    {t:'Toss it some of your trail jerky',go:'cabin',note:'The wolf gobbles the jerky, wags its tail, and trots away. You made a friend. Sort of.'}]},
cabin:{t:'The Hunter\'s Cabin',i:'🛖',cp:1,
  x:s=>`Past the wolf's territory you find an old hunter's cabin, empty and dusty. There's a cold fireplace, a creaky bed, and a wooden chest in the corner${s.flags.chest?' (open now, and empty)':' with a rusty lock'}.\n\nBeyond the cabin, the path climbs toward Grimmholt Hill.`,
  c:s=>[{t:'Open the chest carefully',if:!s.flags.chest,check:{st:'dex',dc:12,
      pass:s=>{s.flags.chest=1;s.gold+=12;s.inv.potion++;return{go:'cabin',note:'Click! You spot a tiny trap needle and pop the lid safely. Inside: 12 gold and a Healing Potion!'}},
      fail:s=>{s.flags.chest=1;const d=dice(1,6);hurt(d);s.gold+=12;s.inv.potion++;return{go:'cabin',note:`OUCH! A tiny needle jabs your thumb (−${d} HP). At least the 12 gold and Healing Potion inside are yours now.`}}}},
    {t:'Light a fire and take a nap',if:!s.flags.cabinRest,act:s=>{s.flags.cabinRest=1;rest(s)},go:'cabin',note:'You doze by the crackling fire. Health and abilities fully restored!'},
    {t:'Continue to Grimmholt Hill',go:'hill'}]},
river:{t:'Mossback Bridge',i:'🌉',
  x:s=>`The river road ends at an old stone bridge covered in moss. Under it sits an enormous troll with a magnificent mane of green, mossy hair. He stands up, and up, and UP.\n\n"Gorp is GORP! This is Gorp's bridge! Pay TOLL! Ten gold, or answer Gorp's riddle. Or..." He grins. "Gorp smash."`,
  c:s=>[{t:'Pay the toll',cost:10,go:'hill',note:'Gorp bites your coins to check they\'re real, then waves you across. "Nice doing business!"'},
    {t:'Answer Gorp\'s riddle',go:'riddle_troll'},
    {t:'Compliment Gorp\'s beautiful hair',check:{st:'wis',dc:s.flags.rumors?8:13,
      pass:s=>{s.gold+=15;return{go:'hill',note:'Gorp blushes dark green. "Nobody EVER notice Gorp\'s hair!" He hands you a shiny troll pebble that turns out to be worth 15 gold, and lets you cross.'}},
      fail:{fight:'troll',win:'hill',note:'"You making FUN of Gorp?!" Uh oh.'}}},
    {t:'Fight Gorp!',fight:'troll',win:'hill'}]},
riddle_troll:{t:'Gorp\'s Riddle',i:'👹',type:'riddle',en:s=>pickRiddle(s),
  x:s=>s.flags.trollTries?`Gorp scratches his head. "Gorp is nice today. ONE more riddle."`:`Gorp rubs his giant hands together. "Gorp LOVES riddles. Answer right, you cross free. Answer wrong..." He cracks his knuckles. It sounds like trees falling over.`,
  ok:s=>{s.gold+=5;return{go:'hill',note:'"ARGH! Correct!" Gorp stomps so hard the bridge wobbles. "Fine. Cross. Take a shiny pebble. Gorp has too many." It\'s a gold coin!'}},
  bad:s=>{s.flags.trollTries=(s.flags.trollTries||0)+1;return s.flags.trollTries<2?{go:'riddle_troll',note:'"WRONG!" says Gorp, delighted.'}:{fight:'troll',win:'hill',note:'"WRONG AGAIN! Gorp SMASH!"'}}},
hill:{t:'Grimmholt Hill',i:'⛰️',cp:1,
  x:s=>`Grimmholt Hill rises out of the mist like a sleeping giant. At the bottom is a cave mouth, dark as a giant's yawn.\n\nA goblin guard sits on a barrel in front of it. He is very busy picking his nose and has not noticed you yet.`,
  c:s=>[{t:'Sneak past him',check:{st:'dex',dc:13,pass:{go:'hall',note:'You tiptoe right past. He doesn\'t even look up from his... project.'},fail:{fight:'goblin',win:'hall',note:'CRACK! You step on a stick. The goblin jumps off his barrel.'}}},
    {t:'Trick him: "The Goblin King wants you, right now!"',check:{st:'int',dc:12,pass:{go:'hall',note:'"Uh-oh, uh-oh!" The goblin scurries off into the woods. Wrong direction, but hey.'},fail:{fight:'goblin',win:'hall',note:'"You not a goblin! You a HERO!" Your goblin voice needs work.'}}},
    {t:'Charge!',fight:'goblin',win:'hall'}]},
hall:{t:'Hall of Echoes',i:'🦇',cp:1,
  x:s=>{const n=['grove','barracks','lake'].filter(k=>s.flags[k]).length;
    return `Inside Grimmholt, every footstep echoes... echoes... echoes. The tunnel opens into a huge hall with three ways to go.\n\nTo the left, a soft blue glow. To the right, the smell of stew and the sound of snoring. In the middle of the floor, a deep crack in the rock breathes cold air.\n\nFrom somewhere far below comes the steady BOOM... BOOM... of goblin drums.${n?`\n\nYou've explored ${n} of the 3 passages.`:''}`},
  c:s=>{const n=['grove','barracks','lake'].filter(k=>s.flags[k]).length;return[
    {t:'Follow the blue glow',if:!s.flags.grove,go:'grove',rand:.4},
    {t:'Follow the smell of stew',if:!s.flags.barracks,go:'barracks',rand:.4},
    {t:'Look down into the crack',if:!s.flags.lake,go:'chasm'},
    {t:'Follow the drums deeper',go:'gate',tag:n<2?'Boss ahead':null,hint:n<2?'Tip: explore more first to find treasure and level up.':null}]}},
grove:{t:'The Mushroom Grove',i:'🍄',en:s=>s.flags.grove=1,
  x:s=>`The tunnel opens into a cave full of giant glowing mushrooms, some as tall as you. They come in three colors: soft BLUE, bright GOLD, and RED with white spots.\n\nAn old stone sign stands in the middle, covered in ancient writing. Behind the mushrooms, you spot carved steps leading up to a shrine.`,
  c:s=>[{t:'Try to read the old sign',if:!s.flags.sign,check:{st:'int',dc:11,
      pass:s=>{s.flags.sign=1;return{go:'grove',note:'The old words say: "Blue makes you new. Gold makes you wise. Red... makes you very, very sorry."'}},
      fail:s=>{s.flags.sign=1;return{go:'grove',note:'The letters are too old and squiggly. You think one of them might be a drawing of a duck.'}}}},
    {t:'Eat a blue mushroom',if:!s.flags.blue,act:s=>{s.flags.blue=1;s.hp=s.max},go:'grove',note:'It tastes like blueberries and mint. Warmth fills you up. HP fully restored!'},
    {t:'Eat a gold mushroom',if:!s.flags.goldm,act:s=>{s.flags.goldm=1;s.flags.pendingLv=gainXP(60)},go:'grove',note:'Whoa. You see visions of ancient heroes and learn from their battles. +60 XP!'},
    {t:'Eat a red spotted mushroom',if:!s.flags.red,act:s=>{s.flags.red=1;const d=dice(1,6);hurt(d);s.flags.rd=d},go:'grove',note:'BLEH! Your tummy gurgles like a swamp. You lose some HP. Maybe don\'t eat random cave mushrooms.'},
    {t:'Climb the steps to the shrine',go:'shrine'},
    {t:'Return to the Hall of Echoes',go:'hall'}]},
shrine:{t:'Shrine of the Dawn',i:'🌅',type:'riddle',en:s=>{if(!s.flags.shrineDone)pickRiddle(s)},done:s=>s.flags.shrineDone,
  x:s=>s.flags.shrineDone?`The stone face of Solenne, goddess of the dawn, rests peacefully in the wall. Her shrine is quiet now.`
   :`A stone face of Solenne, goddess of the dawn, is carved into the wall. As you get close, her eyes glow and her stone lips move.\n\n"Hero. Answer my riddle truly, and I will give you my blessing."`,
  ok:s=>{s.flags.shrineDone=1;s.flags.amulet=1;s.ac+=1;return{go:'shrine',note:'"Wisely answered." A golden amulet shaped like a sunrise appears around your neck. Amulet of Dawn: +1 Armor!'}},
  bad:s=>{s.flags.shrineDone=1;return{go:'shrine',note:'The stone face sighs softly and closes its eyes. "Not today, little hero." At least she didn\'t smash you.'}},
  c:s=>[{t:'Return to the Hall of Echoes',go:'hall'}]},
barracks:{t:'Goblin Barracks',i:'🍲',en:s=>s.flags.barracks=1,
  x:s=>`This is where the goblins live, and it smells like it. Three goblins snore in hammocks around a bubbling pot of stew.\n\nIn the corner sits a locked chest with GRUBNUK'S STUFF DO NOT TUCH painted on it.`,
  c:s=>[{t:'Sneak over to the chest',check:{st:'dex',dc:13,
      pass:s=>{s.gold+=25;s.flags.key=1;return{go:'hall',note:'You pick the lock without a sound. Inside: 25 gold and a big iron key with a skull on it. Wonder what it opens... You sneak back out.'}},
      fail:{fight:'gang',win:s=>{s.gold+=25;s.flags.key=1;return{go:'hall',note:'Inside the chest: 25 gold and a big iron key with a skull on it. Wonder what it opens...'}},note:'You knock over a stack of pots. CLANG! CLANG! CLANG! Everyone wakes up.'}}},
    {t:'Burst in and wake them up!',fight:'gang',win:s=>{s.gold+=25;s.flags.key=1;return{go:'hall',note:'Inside the chest: 25 gold and a big iron key with a skull on it. Wonder what it opens...'}}},
    {t:'Back away quietly',go:'hall'}]},
chasm:{t:'The Crack in the Floor',i:'🧗',
  x:s=>`You kneel at the edge of the crack. It's deep. Very deep. Far below you hear water dripping and see something glittering.\n\nThe walls are rough and slippery.${s.inv.rope?' Good thing you brought rope!':''}`,
  c:s=>[{t:'Tie your rope and climb down',if:!!s.inv.rope,go:'lake',note:'You tie the rope to a rock and climb down like a pro.'},
    {t:'Climb down without a rope',check:{st:'str',dc:13,pass:{go:'lake',note:'Hand over hand, you climb all the way down. Your arms are jelly, but you made it.'},
      fail:s=>{const d=dice(2,4);hurt(d);return{go:'lake',note:`Your foot slips! You slide the last part and land with a SPLASH in cold water (−${d} HP).`}}}},
    {t:'Back to the Hall of Echoes',go:'hall'}]},
lake:{t:'The Underground Lake',i:'💎',en:s=>s.flags.lake=1,
  x:s=>`At the bottom is a hidden lake, glowing with blue crystals. On a little island sits a gorgeous treasure chest covered in gold and jewels.\n\nIt is a VERY nice chest. Almost too nice. Is it... breathing?`,
  c:s=>[{t:'Poke the chest with a stick first',check:{st:'wis',dc:12,
      pass:{fight:'mimic',first:1,win:'mimicwin',note:'The chest yelps! It\'s a MIMIC, a monster pretending to be a chest. You get a free hit before it can bite!'},
      fail:{fight:'mimic',win:'mimicwin',note:'Seems fine... wait. It just ATE your stick. It\'s a MIMIC!'}}},
    {t:'Open the treasure chest',fight:'mimic',win:'mimicwin',note:'You reach for the lid and the lid reaches for YOU. It\'s a MIMIC!'},
    {t:'Climb back up to the hall',go:'hall'}]},
mimicwin:{t:'Mimic Treasure',i:'✨',en:s=>{s.flags.silver=1;s.gold+=30},
  x:s=>`The mimic coughs up 30 gold coins, three old boots, and something wrapped in purple cloth. You unwrap it.\n\nIt's a gleaming ${silverName(s)}! Your attacks now do +2 damage.\n\nYou climb back up to the Hall of Echoes.`,
  c:s=>[{t:'Return to the Hall of Echoes',go:'hall'}]},
gate:{t:'The Drum Gate',i:'🔥',cp:1,
  x:s=>`The drums are deafening here. BOOM. BOOM. BOOM. Two enormous doors stand in front of you, decorated with goblin drawings of a crowned goblin beating up a knight.\n\nThe goblins left a little campfire burning by the wall. This is the last safe spot before whatever is behind those doors.`,
  c:s=>[{t:'Rest by the campfire',if:!s.flags.gateRest,act:s=>{s.flags.gateRest=1;rest(s)},go:'gate',note:'You warm your hands and catch your breath. Health and abilities fully restored!'},
    {t:'Push open the doors',go:'throne'}]},
throne:{t:'The Throne Room',i:'👑',
  x:s=>`You shove the doors open. The throne room is enormous and incredibly messy. On a throne built from broken chairs, an old bathtub, and one rubber duck sits Grubnuk, the Goblin King. His crown is clearly a bucket.\n\nIn his lap glows the Lantern of Dawn.\n\nIn a cage beside the throne, a small halfling with curly hair waves at you like crazy.\n\n"WHO DARES INTERRUPT GRUBNUK?!"`,
  c:s=>[{t:'Fight the Goblin King!',fight:'king',win:s=>{s.flags.lantern=1;return{go:'lantern'}}},
    {t:'Ask him WHY he stole the Lantern',check:{st:'wis',dc:13,
      pass:s=>{s.flags.lantern=1;s.flags.peace=1;return{go:'lantern',note:'Grubnuk\'s lip wobbles. "Grubnuk not WANT to steal it! The shadow in the pit made Grubnuk do it! It said it would eat us!" He sniffles, hands you the Lantern, and runs off to hide in the bathtub.'}},
      fail:{fight:'king',win:s=>{s.flags.lantern=1;return{go:'lantern'}},note:'"Grubnuk no TALK! Grubnuk SMASH!"'}}},
    {t:'Offer him gold for the Lantern',cost:30,act:s=>{s.flags.lantern=1;s.flags.peace=1},go:'lantern',note:'Grubnuk\'s eyes go wide at the shiny coins. "DEAL!" He tosses you the Lantern and dives into the bathtub, counting his gold.'}]},
lantern:{t:'The Shadow Rises',i:'🏮',cp:1,
  x:s=>`You lift the Lantern of Dawn. Its warm golden light fills the room and pushes back every shadow.\n\nWell. Almost every shadow.\n\nThe ground shakes. From a pit behind the throne, something huge climbs out: a dragon made of living darkness, with eyes like two cold stars. THIS is who was really giving the goblins orders.\n\n"I am NYXATHAR," it hisses. "That light is mine to snuff out. Hand it over, little hero."\n\n${s.flags.ally?'Tilly the halfling stands beside you, slingshot loaded. "Ready when you are!"':'From the cage, the halfling whispers: "Psst! Let me out! I\'m Tilly, and I\'m GREAT with a slingshot!"'}`,
  c:s=>[{t:'Unlock the cage with the iron skull key',if:!!(s.flags.key&&!s.flags.ally),act:s=>{s.flags.ally=1},go:'lantern',note:'The skull key fits perfectly! Tilly bursts out and loads her slingshot. "Let\'s get this overgrown shadow puppet!" Tilly will fight beside you.'},
    {t:'Bend the cage bars',if:!!(!s.flags.key&&!s.flags.ally&&!s.flags.bars),check:{st:'str',dc:14,
      pass:s=>{s.flags.ally=1;return{go:'lantern',note:'You heave and the bars bend with a groan! Tilly squeezes out. "You\'re my hero! Now let\'s get that dragon." Tilly will fight beside you.'}},
      fail:s=>{s.flags.bars=1;return{go:'lantern',note:'The bars won\'t budge. "There\'s a skull key somewhere," Tilly sighs. "Go get them anyway!"'}}}},
    {t:'Face Nyxathar!',fight:'dragon',win:'victory',hint:'Tip: shadows HATE the Lantern\'s light. Use it in the fight!'}]},
victory:{t:'Hero of Brackenford',i:'🌄',type:'end',en:s=>{s.gold+=100;const w=store.get(WINS)||{};w[s.cls]=(w[s.cls]||0)+1;store.set(WINS,w);store.del(SAVE)},
  x:s=>`You walk out of Grimmholt just as the sun comes up, the Lantern of Dawn glowing in your hands.\n\nThe whole village of Brackenford is waiting. When they see the light, they cheer so loudly that birds fly out of every tree for a mile. Elder Mara hangs the Lantern back in the square and hands you a fat bag of 100 gold.\n\n"I knew you could do it, ${s.name}."${s.flags.ally?`\n\nTilly the halfling writes a song about your adventure called "The Ballad of ${s.name}." It has forty-seven verses. Everyone in the tavern has to hear all forty-seven.`:''}${s.flags.peace?`\n\nA week later, a note arrives, written in crayon: SORRY FOR STEELING. YOU ARE OK FOR A HERO. FROM GRUBNUK. Now the goblins trade mushrooms with the village every Tuesday.`:''}${s.flags.amulet?`\n\nSometimes, at sunrise, your Amulet of Dawn glows warm, like the goddess is saying thank you.`:''}`},
};


const $=s=>document.querySelector(s);
const R=n=>1+Math.floor(Math.random()*n);
const dice=(c,d,b=0)=>{let t=b;for(let i=0;i<c;i++)t+=R(d);return t};
const sign=n=>(n>=0?'+':'−')+Math.abs(n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SAVE=GAME.key+'_save_v2', WINS=GAME.key+'_wins_v1';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const STATN={str:'Strength',dex:'Dexterity',int:'Intelligence',wis:'Wisdom'};
const CL={
  fighter:{name:'Fighter',i:'🛡️',blurb:'Tough as nails. Big sword, heavy armor, hard to knock down.',hp:14,lv:7,ac:16,st:{str:3,dex:1,int:0,wis:0},
    wpn:{n:'Longsword',c:1,d:8,s:'str'},sw:'Longsword',sp:{n:'Second Wind',d:'Heal 1d10 + your level',uses:2,k:'heal'}},
  ranger:{name:'Ranger',i:'🏹',blurb:'Expert tracker and archer. Marks a target and never lets it go.',hp:12,lv:6,ac:14,st:{str:1,dex:3,int:0,wis:1},
    wpn:{n:'Longbow',c:1,d:8,s:'dex'},sw:'Longbow',sp:{n:'Hunter\'s Mark',d:'Mark the monster and shoot. Every hit this fight does +1d6',uses:2,k:'mark'}},
  rogue:{name:'Rogue',i:'🗡️',blurb:'Sneaky and quick. Great at tricks, traps and surprise attacks.',hp:11,lv:6,ac:14,st:{str:0,dex:3,int:1,wis:1},
    wpn:{n:'Shortsword',c:1,d:6,s:'dex'},sw:'Shortsword',sp:{n:'Sneak Attack',d:'Roll twice, keep the best. +2d6 damage on a hit',uses:2,k:'sneak'}},
  druid:{name:'Druid',i:'🌿',blurb:'Nature magic. Lashes foes with thorns and can turn into a bear!',hp:10,lv:6,ac:13,st:{str:0,dex:1,int:1,wis:3},
    wpn:{n:'Thorn Whip',c:1,d:8,s:'wis'},sw:'Oak Staff',sp:{n:'Wild Shape: Bear',d:'Become a bear! Gain 2d6 + level bonus HP and +2 damage this fight',uses:2,k:'bear'}},
  wizard:{name:'Wizard',i:'🔮',blurb:'Fragile but brilliant. Throws fire and magic darts that never miss.',hp:9,lv:5,ac:12,st:{str:-1,dex:1,int:3,wis:1},
    wpn:{n:'Fire Bolt',c:1,d:10,s:'int'},sw:'Wand',sp:{n:'Magic Missile',d:'3 glowing darts that never miss (1d4+1 each)',uses:3,k:'missile'}},
  cleric:{name:'Cleric',i:'☀️',blurb:'Holy warrior. Heals wounds and burns monsters with sacred fire.',hp:11,lv:6,ac:15,st:{str:1,dex:0,int:0,wis:3},
    wpn:{n:'Sacred Flame',c:1,d:8,s:'wis'},sw:'Holy Symbol',sp:{n:'Cure Wounds',d:'Heal 1d8 + 3 + your level',uses:2,k:'cure'}},
};
const RACES={
  human:{name:'Human',i:'🧑',blurb:'Brave and adaptable.',st:{str:1,dex:1,int:1,wis:1},perk:'Versatile: +1 to every ability.'},
  elf:{name:'Elf',i:'🧝',blurb:'Graceful forest folk with sharp eyes.',st:{dex:2,wis:1},perk:'Keen Senses: +2 extra on Wisdom checks.'},
  tiefling:{name:'Tiefling',i:'😈',blurb:'Horns, a tail, and fire in the blood.',st:{int:2,wis:1},perk:'Hellish Rebuke: the first time a monster hits you in a fight, flames burn it for 2d6.'},
  dwarf:{name:'Dwarf',i:'🧔',blurb:'Stout, stubborn, and hard as stone.',st:{str:2,wis:1},perk:'Dwarven Toughness: +3 HP, plus 1 more every level.'},
  halfling:{name:'Halfling',i:'🧒',blurb:'Small, cheerful, and amazingly lucky.',st:{dex:2,int:1},perk:'Lucky: start with a free lucky charm to reroll a failed check.'},
  dragonborn:{name:'Dragonborn',i:'🐲',blurb:'Proud dragon folk with scales of bronze.',st:{str:2,wis:1},perk:'Dragon Breath: once per fight, breathe fire for 2d6 + level damage.'},
};
const heroStats=(c,r)=>{const o={...CL[c].st};for(const k in RACES[r].st)o[k]+=RACES[r].st[k];return o};
const silverName=s=>GAME.silver+' '+CL[s.cls].sw;

let S=null, C=null, busy=false, screen='title', cur=[];
const cls=()=>CL[S.cls], race=()=>RACES[S.race];
const toHit=()=>S.st[cls().wpn.s]+(S.lvl>=3?3:2)+(S.diff==='easy'?2:0);
const dmgB=()=>S.st[cls().wpn.s]+(S.flags.silver?2:0)+(C&&C.bear?2:0);
const wpnName=()=>S.flags.silver?silverName(S):cls().wpn.n;
function hurt(n){S.hp=Math.max(1,S.hp-n)}
function heal(n){const b=S.hp;S.hp=Math.min(S.max,S.hp+n);return S.hp-b}
function rest(s){s.hp=s.max;s.uses=CL[s.cls].sp.uses}
const LV=[0,100,300,600,1000];
function gainXP(n){S.xp+=n;let out='';while(S.lvl<5&&S.xp>=LV[S.lvl]){S.lvl++;const g=cls().lv+(S.race==='dwarf'?1:0);S.max+=g;S.hp=S.max;S.uses=cls().sp.uses;
  out+=`<div class="lvup">LEVEL UP! You are now level ${S.lvl}. +${g} max HP${S.lvl===3?', and your attacks get more accurate':''}. Health and abilities restored!</div>`}return out}
function pickRiddle(s){let used=s.flags.used||[];let av=RIDDLES.map((_,i)=>i).filter(i=>!used.includes(i));if(!av.length){used=[];av=RIDDLES.map((_,i)=>i)}
  const i=pick(av);used.push(i);s.flags.used=used;s.flags.rq=i;s.flags.ro=shuffle([RIDDLES[i][1],...RIDDLES[i][2]])}

/* ---------- FLOW ---------- */
function save(){if(S&&S.node!=='victory')store.set(SAVE,S)}
function makeCp(){S.cp=null;S.cp=JSON.stringify(S)}
function restoreCp(){const cp=S.cp;S=JSON.parse(cp);S.cp=cp;rest(S);S.mode='story';S.note='Everything went dark... then a warm voice whispered, "Not yet, hero." You wake up at your last safe spot, fully healed. Let\'s try that again!';C=null;busy=false;save();render()}
function go(t,note){
  if(typeof t==='function')t=t(S);
  if(t&&typeof t==='object'){if(t.fight)return startCombat(t.fight,t.win,t.first,t.note||note);note=t.note||note;t=t.go}
  S.note=note||'';S.node=t;S.mode='story';const n=N[t];if(n.en)n.en(S);
  if(n.cp)makeCp();save();render();window.scrollTo(0,0);
  if(S.flags.pendingLv){const l=S.flags.pendingLv;S.flags.pendingLv='';msg('Level up!',l,'Awesome!')}
}
function choose(i){
  const ch=cur[i];if(!ch||busy)return;
  if(ch.cost){if(S.gold<ch.cost)return;S.gold-=ch.cost}
  if(ch.act)ch.act(S);
  if(ch.check)return doCheck(ch);
  if(ch.rand&&Math.random()<ch.rand)return startCombat(pick(MINOR),ch.go,0,'Something lurks in the tunnel ahead!');
  if(ch.fight)return go(ch);
  go(ch.go,ch.note);
}
function checkBonus(st){return S.st[st]+(S.race==='elf'&&st==='wis'?2:0)}
function doCheck(ch){const k=ch.check;
  rollD20({kind:'check',title:`${STATN[k.st]} check`,sub:ch.t,bonus:checkBonus(k.st),blabel:k.st.toUpperCase(),target:k.dc,tlabel:'needed'},ok=>go(ok?k.pass:k.fail))}

/* ---------- DICE OVERLAY ---------- */
const D20=`<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="var(--torch)" stroke="var(--dieline)" stroke-width="3"/><polygon points="50,24 79,70 21,70" fill="var(--torch2)" stroke="var(--dieline)" stroke-width="2"/><g stroke="var(--dieline)" stroke-width="2"><line x1="50" y1="3" x2="50" y2="24"/><line x1="93" y1="27" x2="79" y2="70"/><line x1="7" y1="27" x2="21" y2="70"/><line x1="93" y1="73" x2="79" y2="70"/><line x1="7" y1="73" x2="21" y2="70"/><line x1="50" y1="97" x2="79" y2="70"/><line x1="50" y1="97" x2="21" y2="70"/><line x1="7" y1="27" x2="50" y2="24"/><line x1="93" y1="27" x2="50" y2="24"/></g></svg>`;
function openOv(html){$('#ovbox').innerHTML=html;$('#ov').hidden=false}
function closeOv(){$('#ov').hidden=true}
function msg(title,body,btn,cb){openOv(`<h3>${title}</h3><div class="body">${body}</div><div class="btns"><button class="big" id="ovOk">${btn||'Continue'}</button></div>`);
  $('#ovOk').onclick=()=>{closeOv();cb&&cb()};$('#ovOk').focus()}
function rollD20(o,cb){
  openOv(`<h3>${o.title}</h3><div class="sub">${o.sub||''}</div>
   <div class="die" id="die">${D20}<span class="num" id="dn">20</span></div>
   <div class="res" id="dres">${o.kind==='check'?`Roll a d20 and add your ${o.blabel} bonus (${sign(o.bonus)}). You need ${o.target} or more.`:''}</div>
   <div class="verdict" id="dv"></div><div class="btns" id="db"></div>`);
  const db=$('#db');
  const spin=()=>{
    db.innerHTML='';$('#dv').textContent='';$('#dv').className='verdict';
    const die=$('#die');die.className='die spin';
    const r1=R(20),r2=o.adv?R(20):null,nat=r2?Math.max(r1,r2):r1;
    const dur=REDUCED?150:850;const t0=performance.now();
    const tick=()=>{if(performance.now()-t0<dur){$('#dn').textContent=R(20);setTimeout(tick,55)}else land()};
    const land=()=>{
      $('#dn').textContent=nat;die.className='die land'+(nat===20?' crit':nat===1?' fumble':'');
      const tot=nat+o.bonus;
      const ok=o.kind==='check'?(nat===20||tot>=o.target):(nat===20||(nat!==1&&tot>=o.target));
      $('#dres').innerHTML=`${r2?`You rolled ${r1} and ${r2}, keeping ${nat}.<br>`:''}${nat} ${sign(o.bonus)} ${o.blabel} = <b>${tot}</b> &nbsp;·&nbsp; ${o.tlabel} ${o.target}`;
      const v=$('#dv');
      if(nat===20){v.textContent=o.kind==='check'?'Natural 20!':'Critical hit!';v.classList.add('crit')}
      else if(nat===1&&o.kind!=='check'){v.textContent='Oops! Natural 1';v.classList.add('bad')}
      else{v.textContent=ok?(o.kind==='check'?'Success!':'Hit!'):(o.kind==='check'?'Failed!':'Miss!');v.classList.add(ok?'ok':'bad')}
      if(o.auto){let done=false;const fin=()=>{if(done)return;done=true;closeOv();cb(ok,nat)};
        db.innerHTML=`<button class="ghost" id="dgo">Continue</button>`;$('#dgo').onclick=fin;setTimeout(fin,REDUCED?900:1300);return}
      const canLuck=!ok&&S.inv.luck>0;
      db.innerHTML=(canLuck?`<button class="big" id="dluck">Use your ${GAME.luck} (reroll)</button>`:'')+`<button class="${canLuck?'ghost':'big'}" id="dgo">Continue</button>`;
      $('#dgo').onclick=()=>{closeOv();cb(ok,nat)};$('#dgo').focus();
      if($('#dluck'))$('#dluck').onclick=()=>{S.inv.luck--;$('#dres').textContent='Your lucky charm glows... roll again!';spin()};
    };
    tick();
  };
  if(o.kind==='check'){db.innerHTML=`<button class="big" id="droll">Roll the d20!</button>`;$('#droll').onclick=spin;$('#droll').focus()}else spin();
}

/* ---------- COMBAT ---------- */
function startCombat(id,win,first,note){
  const b=MON[id],easy=S.diff==='easy',hp=easy?Math.ceil(b.hp*.8):b.hp;
  C={id,m:{...b,hp,max:hp,atk:b.atk-(easy?1:0)},win,from:S.node,round:1,log:[],lan:false,hit:false,thp:0,bear:false,mark:false,breathUsed:false,rebuked:false};
  if(note)C.log.unshift({c:'n',t:note});C.log.unshift({c:'n',t:b.intro});
  if(first){const d=dice(cls().wpn.c,cls().wpn.d,dmgB());C.m.hp-=d;C.log.unshift({c:'p',t:`Free hit! You strike first for ${d} damage.`})}
  S.mode='combat';busy=false;render();window.scrollTo(0,0);
}
const log=(c,t)=>C.log.unshift({c,t});
function hitFoe(n){C.m.hp-=n;C.hit=true}
function attack(kind){
  if(busy)return;busy=true;const w=cls().wpn,sneak=kind==='sneak';if(sneak)S.uses--;render();
  rollD20({kind:'atk',title:sneak?'Sneak Attack!':(C.bear?'Bear Swipe!':wpnName()),sub:`vs ${C.m.n}`,bonus:toHit(),blabel:'',target:C.m.ac,tlabel:'Armor',adv:sneak,auto:1},(ok,nat)=>{
    if(ok){const cm=nat===20?2:1;let d=dice(w.c*cm,w.d,dmgB()),ex=[];
      if(sneak){const s=dice(2*cm,6);d+=s;ex.push(`${s} sneak`)}
      if(C.mark){const s=dice(cm,6);d+=s;ex.push(`${s} from Hunter's Mark`)}
      hitFoe(d);log('p',`${nat===20?'CRITICAL HIT! ':''}${C.bear?'Your giant bear claws hit':'Your '+wpnName()+' hits'} the ${C.m.n} for ${d} damage${ex.length?` (${ex.join(', ')})`:''}!`)}
    else log('p',nat===1?pick(['You trip over your own feet. Miss!','Your weapon slips out of your hand for a second. Miss!','You sneeze at the worst possible moment. Miss!']):`You miss the ${C.m.n}!`);
    after();
  });
}
function special(){
  if(busy||S.uses<1)return;const sp=cls().sp;
  if(sp.k==='sneak')return attack('sneak');
  if(sp.k==='mark'){if(C.mark)return;S.uses--;C.mark=true;log('p',`You fix your eyes on the ${C.m.n}. It's MARKED. It can't hide from you now!`);return attack('atk')}
  busy=true;S.uses--;
  if(sp.k==='bear'){if(C.bear){busy=false;S.uses++;return}const t=dice(2,6,S.lvl);C.thp+=t;C.bear=true;log('h',`You drop to all fours, fur bursts out, and you ROAR! You're a giant bear: +${t} bonus HP and +2 damage this fight.`)}
  else if(sp.k==='missile'){const a=[dice(1,4,1),dice(1,4,1),dice(1,4,1)],t=a[0]+a[1]+a[2];hitFoe(t);log('p',`Three glowing darts zip from your fingers: ${a.join(' + ')} = ${t} damage!`)}
  else{const n=sp.k==='heal'?dice(1,10,S.lvl):dice(1,8,3+S.lvl);const g=heal(n);log('h',sp.k==='heal'?`You catch your breath and power through. +${g} HP!`:`Healing light flows over your wounds. +${g} HP!`)}
  after();
}
function potion(){if(busy||S.inv.potion<1)return;busy=true;S.inv.potion--;const g=heal(dice(2,4,2));log('h',`${GAME.sip||'Glug glug. The potion tastes like cherries.'} +${g} HP!`);after()}
function relic(){if(busy||C.lan)return;busy=true;C.lan=true;const d=dice(3,8,2);hitFoe(d);log('p',`${GAME.relic.log} The ${C.m.n} shrieks: ${d} damage!`);after()}
function dbreath(){if(busy||C.breathUsed)return;busy=true;C.breathUsed=true;const d=dice(2,6,S.lvl);hitFoe(d);log('p',`You take a deep breath and blast a cone of dragon fire! ${d} damage!`);after()}
function flee(){if(busy||C.m.boss)return;busy=true;render();
  rollD20({kind:'atk',title:'Run away!',sub:'Dexterity check',bonus:S.st.dex,blabel:'DEX',target:12,tlabel:'needed',auto:1},ok=>{
    if(ok){const f=C.from;C=null;busy=false;go(f,'You run for it and get away! Phew.');return}
    log('n','You try to run, but you can\'t get away!');after()})}
function after(){
  render();
  if(C.m.hp<=0)return setTimeout(winFight,550);
  setTimeout(()=>{
    if(S.flags.ally){const d=dice(1,4,1);hitFoe(d);log('a',pick(GAME.ally.lines).replace('{d}',d));
      if(C.m.hp<=0){render();return setTimeout(winFight,550)}}
    foeTurn();C.round++;busy=false;render();
    if(C.m.hp<=0)return setTimeout(winFight,550);
    if(S.hp<=0)setTimeout(lose,600);
  },650);
}
function hurtP(d){
  if(C.thp>0){const a=Math.min(C.thp,d);C.thp-=a;d-=a;if(C.thp<=0&&C.bear){C.bear=false;log('n','POOF! Your bear form wears off and you turn back into yourself.')}}
  S.hp-=d;
}
function foeTurn(){
  const m=C.m;const before=S.hp+C.thp;let hit=false;
  if(m.breath&&C.round%3===0){const r=R(20),sv=r+S.st.dex;let d=dice(3,6);const ok=r===20||sv>=13;if(ok)d=Math.floor(d/2);hurtP(d);hit=true;
    log('m',`${m.bt} You dive for cover (${r}${sign(S.st.dex)} = ${sv} vs 13) ${ok?'and only get grazed':'but it catches you'}: ${d} damage!`)}
  else{const r=R(20),tot=r+m.atk;
    if(r===20||(r!==1&&tot>=S.ac)){const d=dice(m.dmg[0]*(r===20?2:1),m.dmg[1],m.dmg[2]);hurtP(d);hit=true;log('m',`${r===20?'Critical! ':''}The ${m.n} ${m.v} you for ${d} damage!`)}
    else log('n',`The ${m.n} ${m.v} you, but misses! (rolled ${tot} vs your Armor ${S.ac})`);
    if(m.breath&&C.round%3===2)log('n',m.tele)}
  if(hit&&S.race==='tiefling'&&!C.rebuked&&S.hp>0){C.rebuked=true;const d=dice(2,6);hitFoe(d);log('p',`Hellish Rebuke! Your eyes flash red and flames burst around the ${m.n}: ${d} damage!`)}
  if(S.hp+C.thp<before){document.body.classList.remove('ouch');void document.body.offsetWidth;document.body.classList.add('ouch')}
}
function winFight(){
  const m=C.m;S.kills[C.id]=(S.kills[C.id]||0)+1;S.gold+=m.gold;const lv=gainXP(m.xp);busy=false;
  msg('Victory!',`<p>${m.bye}</p><p><b>+${m.xp} XP</b>${m.gold?` &nbsp;·&nbsp; <b>+${m.gold} gold</b>`:''}</p>${lv}`,'Continue',()=>{const w=C.win;C=null;go(w)});
}
function lose(){busy=true;msg('You have fallen...','<p>The world spins, and everything goes dark.</p><p>But heroes don\'t give up that easily.</p>','Rise again',()=>restoreCp())}

function renderTitle(m){
  const w=store.get(WINS)||{},sv=store.get(SAVE);
  m.innerHTML=`<div class="title"><div class="lantern" aria-hidden="true">${GAME.icon}</div><h1>${GAME.title}</h1><div class="tag-line">${GAME.tagline}</div>
   <div class="menu">${sv?`<button class="big" id="cont">Continue: ${sv.name} the ${RACES[sv.race].name} ${CL[sv.cls].name}</button><button class="ghost" id="nw">Start a new adventure</button>`:`<button class="big" id="nw">Start a new adventure</button>`}</div></div>
   <div class="trophies"><h3>Classes that beat the game</h3><div class="tro">${Object.entries(CL).map(([k,c])=>`<span class="${w[k]?'won':''}"><i>${c.i}</i>${c.name}</span>`).join('')}</div></div>
   <details><summary>How to play</summary><ul>
   <li>Read what happens, then tap a choice to decide what your hero does.</li>
   <li>Choices with a blue tag like <b>DEX 13</b> are checks. Roll a 20-sided die (d20) and add your bonus. Get 13 or more to succeed. A natural 20 always works!</li>
   <li>In battle, roll to hit. You need to match or beat the monster's Armor number.</li>
   <li>Your race gives you a special power, and your class gives you another. Try different combos!</li>
   <li>Win battles to earn XP and level up. Gold buys potions at the shop.</li>
   <li>If you fall, you'll wake up at the last safe spot. Your game saves itself as you go.</li>
   <li>Tap your hero's name at the top to see your hero sheet.</li></ul></details>`;
  $('#nw').onclick=()=>{screen='create';render()};
  if($('#cont'))$('#cont').onclick=()=>{S=sv;screen='game';S.mode='story';render()};
}
let pickC='fighter',pickR='human',pickD='normal',pickN='';
function renderCreate(m){
  const st=heroStats(pickC,pickR),hp=CL[pickC].hp+(pickR==='dwarf'?3:0);
  m.innerHTML=`<article class="card"><div class="scene-head"><div class="badge" aria-hidden="true">📜</div><h2>Create your hero</h2></div>
   <label class="f" for="hn">Hero name</label><input type="text" id="hn" maxlength="16" placeholder="Leave blank for a random name" value="${pickN}">
   <label class="f">Choose your race</label><div class="grid races">${Object.entries(RACES).map(([k,r])=>`<button class="cls ${k===pickR?'sel':''}" data-r="${k}"><span class="ci">${r.i}</span><b>${r.name}</b><small>${r.blurb}</small></button>`).join('')}</div>
   <div class="perk"><b>${RACES[pickR].name} power</b> ${RACES[pickR].perk}</div>
   <label class="f">Choose your class</label><div class="grid">${Object.entries(CL).map(([k,c])=>`<button class="cls ${k===pickC?'sel':''}" data-k="${k}"><span class="ci">${c.i}</span><b>${c.name}</b><small>${c.blurb}</small></button>`).join('')}</div>
   <div class="perk"><b>${CL[pickC].sp.n}</b> ${CL[pickC].sp.d}.</div>
   <div class="preview"><div class="pv-name">${RACES[pickR].name} ${CL[pickC].name}</div><div class="pv-st">
     <span><em>HP</em> ${hp}</span><span><em>Armor</em> ${CL[pickC].ac}</span>${Object.keys(STATN).map(s=>`<span><em>${s.toUpperCase()}</em> ${sign(st[s])}</span>`).join('')}</div></div>
   <label class="f">Difficulty</label><div class="seg"><button data-d="normal" class="${pickD==='normal'?'sel':''}">Normal<small>Real D&amp;D danger</small></button><button data-d="easy" class="${pickD==='easy'?'sel':''}">Easy<small>Weaker monsters, better aim</small></button></div>
   <div class="choices"><button class="big" id="go">Begin the adventure</button><button class="ghost" id="bk">Back</button></div></article>`;
  $('#hn').oninput=e=>pickN=e.target.value;
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{pickC=b.dataset.k;render()});
  m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{pickR=b.dataset.r;render()});
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{pickD=b.dataset.d;render()});
  $('#bk').onclick=()=>{screen='title';render()};
  $('#go').onclick=()=>{
    const n=(pickN||'').replace(/[^\p{L}\p{N} '\-]/gu,'').trim().slice(0,16)||pick(['Brannoc','Kestrel','Thorne','Zephyr','Rook','Talon','Juno','Ash','Wren','Cassius']);
    const c=CL[pickC];
    S={name:n,cls:pickC,race:pickR,diff:pickD,lvl:1,xp:0,hp,max:hp,ac:c.ac,st:heroStats(pickC,pickR),gold:20,inv:{potion:1,rope:0,luck:pickR==='halfling'?1:0},uses:c.sp.uses,flags:{},kills:{},node:GAME.start,note:'',mode:'story',cp:null};
    pickN='';screen='game';go(GAME.start);
  };
}
render();

</script>
</body>
</html>
