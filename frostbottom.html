<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brrr-serkers of Frostbottom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one centered column (max 680px). Sticky hero bar, story card, big stacked choices, dice tray modal. Single dark theme by choice. */
:root{--bg:#0b1a2e;--panel:#11263f;--panel2:#183251;--line:#2b4d73;--ink:#eef6ff;--mute:#9fb8d4;
  --torch:#7fd3ff;--torch2:#d2f1ff;--blood:#ff6b7a;--mana:#b59cff;--leaf:#7ce0a8;--dieline:#1c4a6e;--barbg:rgba(11,26,46,.94);
  --btnink:#08223a;--notebg:#14324d;--noteline:#3d7fae;--selbg:#1c3f63;--lan1:#4a2e1a;--lan2:#2e1f16;--badge:#1d4166;--glow:127,211,255;
  --f-disp:'Luckiest Guy','Comic Sans MS','Trebuchet MS',sans-serif;
  --f-body:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;min-height:100vh;
  background:radial-gradient(ellipse 90% 50% at 50% -8%, rgba(var(--glow),.16), transparent 70%),var(--bg);}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--torch2);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}

/* hero bar */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--barbg);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-in{max-width:680px;margin:0 auto;display:flex;gap:12px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.who{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:left;min-width:0}
.who .ico{font-size:22px}
.who b{display:block;font-size:15px;line-height:1.1;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--mute);font-size:12px;font-weight:700}
.vitals{flex:1;min-width:0}
.vit-row{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.track{height:10px;background:#0c0f1a;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;background:linear-gradient(90deg,#b8322a,var(--blood));transition:width .4s}
.track.xp{height:5px;margin-top:4px;border:0}
.track.xp i{background:var(--mana)}
.purse{display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.purse .g{color:var(--torch2)}
.ouch #bar{animation:ouch .45s}
@keyframes ouch{0%,100%{background:var(--barbg)}30%{background:rgba(160,40,34,.75)}}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.scene-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.badge{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 50% 40%,var(--badge),#1a1a22);border:2px solid var(--torch);box-shadow:0 0 18px rgba(var(--glow),.3)}
.scene-head h2{font-size:30px;color:var(--torch2);line-height:1.1}
.card p{margin:0 0 12px;max-width:62ch}
.card p:last-child{margin-bottom:0}
.note{background:var(--notebg);border:1px solid var(--noteline);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.note span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--torch)}
.note p{margin:2px 0 0;font-weight:600}
.lvup{margin-top:10px;padding:10px 12px;border-radius:10px;background:#1b2c40;border:1px solid var(--mana);color:#cfe6ff;font-weight:700}

.choices{display:grid;gap:10px;margin-top:16px}
.ch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:700;font-size:17px;transition:border-color .15s,transform .1s}
.ch:hover:not(:disabled){border-color:var(--torch)}
.ch:active:not(:disabled){transform:scale(.985)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.ch .arr{color:var(--torch);font-size:20px;line-height:1}
.ch .lab{flex:1;min-width:0}
.tag{flex:none;font-size:12px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.chk{color:var(--mana)} .tag.bat{color:var(--blood)} .tag.gold{color:var(--torch2)} .tag.done{color:var(--leaf)}
.hint{color:var(--mute);font-size:14px;margin-top:10px}

/* shop & riddle */
.shop{display:grid;gap:10px;margin-top:14px}
.item{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.item div{flex:1;min-width:0}
.item b{display:block}
.item small{color:var(--mute);font-size:14px}
.buy{background:var(--torch);color:var(--btnink);border:0;border-radius:10px;padding:8px 12px;font-weight:800;white-space:nowrap}
.buy:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.riddle{margin-top:14px;padding:16px;border-radius:14px;background:#151a2b;border:1px dashed var(--torch)}
.riddle q{display:block;font-family:var(--f-disp);font-size:26px;color:var(--torch2);quotes:none;line-height:1.2;margin-bottom:12px}
.riddle .opts{display:grid;gap:8px}

/* combat */
.foe{text-align:center}
.foe-ico{font-size:76px;line-height:1.1;display:inline-block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.foe.hit .foe-ico{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(10px) rotate(5deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.foe h2{font-size:30px;color:var(--torch2);margin:4px 0 10px}
.foe .track{height:14px;max-width:360px;margin:0 auto}
.foe-meta{display:flex;justify-content:center;gap:16px;margin-top:6px;font-size:14px;font-weight:800;color:var(--mute);font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.act{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-width:0}
.act b{display:block;font-size:16px}
.act small{display:block;color:var(--mute);font-size:13px;line-height:1.3;margin-top:2px}
.act.main{border-color:var(--torch);background:var(--selbg)}
.act.lan{grid-column:1/-1;border-color:var(--torch2);background:linear-gradient(90deg,var(--lan1),var(--lan2));animation:glow 1.6s infinite alternate}
@keyframes glow{to{box-shadow:0 0 22px rgba(255,216,137,.35)}}
.act:hover:not(:disabled){border-color:var(--torch2)}
.act:disabled{opacity:.4;cursor:not-allowed}
.log{margin-top:16px;display:grid;gap:6px;font-size:15px}
.log div{padding:8px 12px;border-radius:10px;background:#161b2b}
.log div:first-child{background:#20263a;font-weight:700}
.log .p{color:var(--torch2)} .log .m{color:#ff9a90} .log .a,.log .h{color:#9be3ad} .log .n{color:var(--mute)}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(6,8,14,.78);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ovbox{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:var(--panel);border:2px solid var(--torch);border-radius:20px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ovbox h3{font-size:30px;color:var(--torch2)}
.ovbox .sub{color:var(--mute);margin:4px 0 6px}
.ovbox .body{text-align:left;margin-top:10px}
.die{position:relative;width:140px;height:140px;margin:10px auto}
.die svg{width:100%;height:100%}
.die .num{position:absolute;inset:0;display:grid;place-items:center;padding-top:12px;font-family:var(--f-disp);font-size:44px;color:var(--btnink)}
.die.spin svg{animation:spin .85s cubic-bezier(.2,.7,.3,1)}
@keyframes spin{from{transform:rotate(0) scale(.7)}to{transform:rotate(720deg) scale(1)}}
.die.land{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.15)}}
.die.crit svg polygon:first-child{fill:#ffd889}
.die.crit{filter:drop-shadow(0 0 18px rgba(255,216,137,.9))}
.die.fumble svg polygon:first-child{fill:#e2574c}
.res{font-variant-numeric:tabular-nums;font-weight:700;min-height:1.5em}
.verdict{font-family:var(--f-disp);font-size:34px;line-height:1.1;min-height:1.1em;margin:4px 0}
.verdict.ok{color:var(--leaf)} .verdict.bad{color:var(--blood)} .verdict.crit{color:var(--torch2)}
.btns{display:grid;gap:8px;margin-top:14px}
.big{background:var(--torch);color:var(--btnink);border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:18px}
.big:hover{background:var(--torch2)}
.ghost{background:transparent;border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700}
.ghost:hover{border-color:var(--torch)}

/* title & creation */
.title{text-align:center;padding-block:28px 8px}
.lantern{font-size:72px;display:inline-block;animation:flick 2.4s infinite;filter:drop-shadow(0 0 26px rgba(var(--glow),.7))}
@keyframes flick{0%,100%{filter:drop-shadow(0 0 26px rgba(var(--glow),.7))}45%{filter:drop-shadow(0 0 14px rgba(var(--glow),.45))}55%{filter:drop-shadow(0 0 32px rgba(255,216,137,.8))}}
.title h1{font-size:clamp(46px,12vw,78px);line-height:.95;color:var(--torch2);text-shadow:0 4px 0 var(--dieline),0 0 30px rgba(var(--glow),.35)}
.title .tag-line{color:var(--mute);font-weight:700;margin:10px 0 22px}
.menu{display:grid;gap:10px;max-width:360px;margin:0 auto}
.trophies{margin-top:28px;text-align:center}
.trophies h3{font-family:var(--f-body);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.tro{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tro span{width:64px;padding:8px 0;border-radius:12px;border:1px dashed var(--line);font-size:12px;font-weight:800;color:var(--mute)}
.tro span i{display:block;font-style:normal;font-size:24px;filter:grayscale(1);opacity:.35}
.tro span.won{border:1px solid var(--torch);color:var(--torch2);background:var(--notebg)}
.tro span.won i{filter:none;opacity:1}
details{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
summary{font-weight:800;cursor:pointer}
details ul{margin:10px 0 0;padding-left:20px}
details li{margin-bottom:6px}
label.f{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
input[type=text]{width:100%;background:#0f1320;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:20px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cls{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.cls.sel{border-color:var(--torch);background:var(--selbg);box-shadow:0 0 0 3px rgba(var(--glow),.2)}
.cls .ci{font-size:28px}
.cls b{display:block;font-family:var(--f-disp);font-weight:400;font-size:24px;color:var(--torch2);line-height:1.1}
.cls small{display:block;color:var(--mute);font-size:13px;line-height:1.35;margin-top:2px}
.cls .st{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.cls .st em{font-style:normal;color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px;font-weight:700;text-align:left}
.seg button small{display:block;color:var(--mute);font-weight:600;font-size:13px}
.seg button.sel{border-color:var(--torch);background:var(--selbg)}
.sheet-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.sheet-stats div{background:var(--panel2);border-radius:10px;padding:8px 4px;text-align:center}
.sheet-stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sheet-stats small{font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.08em}
.kv{display:grid;gap:6px;font-size:15px}
.kv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.kv span{color:var(--mute)}
.kv b{text-align:right}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.summary div{background:var(--panel2);border-radius:12px;padding:10px 6px;text-align:center}
.summary b{display:block;font-size:24px;color:var(--torch2);font-variant-numeric:tabular-nums}
.summary small{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
@media (max-width:420px){.acts{grid-template-columns:1fr}.scene-head h2{font-size:26px}.sheet-stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr}}
.perk{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px dashed var(--line);font-size:15px}
.perk b{color:var(--torch2);margin-right:4px}
.preview{margin-top:18px;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--torch)}
.pv-name{font-family:var(--f-disp);font-size:26px;color:var(--torch2);line-height:1.1}
.pv-st{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-weight:800;font-variant-numeric:tabular-nums}
.pv-st em{font-style:normal;color:var(--mute);font-size:12px;margin-right:3px}
.status{display:flex;justify-content:center;gap:8px;margin-top:8px}
.status span{font-size:12px;font-weight:800;letter-spacing:.05em;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--mana);color:var(--mana)}
.thp{color:var(--mana)}
.who small{white-space:nowrap}
</style>
</head>
<body>
<header id="bar" hidden></header>
<main class="wrap" id="main"></main>
<div class="ov" id="ov" hidden><div class="ovbox" id="ovbox"></div></div>
<script>
const GAME={key:'frostbottom',title:'Brrr-serkers of Frostbottom',tagline:'A frosty, ridiculous Dungeons &amp; Dragons-style adventure. Ice warriors, yetis, penguin knights, and one very chilly skeleton.',icon:'🧊',start:'hall',silver:'Toasty',luck:'Lucky Frozen Fish',sip:'Glug glug. Hot cocoa with tiny marshmallows!',
 relic:{btn:'Splash the Everwarm Mug',desc:'3d8+2 hot-cocoa damage. Ice monsters HATE it! Once per fight.',log:'You fling a wave of piping-hot magic cocoa, tiny marshmallows and all!'},
 ally:{name:'Sir Waddlesworth, Penguin Knight',lines:['Sir Waddlesworth belly-slides into it beak first: {d} damage!','"FOR THE FROSTGUARD! HONK!" Sir Waddlesworth pokes it with his tiny sword: {d} damage!','Sir Waddlesworth slaps it with a flipper. Rude, but effective: {d} damage!']},
 items:[['sweater','Grandma\'s Ugly Sweater (the reindeer looks like a potato)'],['scarf','Snowman\'s Scarf (+1 Armor)'],['lantern','Everwarm Mug']]};
const MON={
  snowman:{n:`Evil Snowman`,i:`⛄`,hp:10,ac:10,atk:3,dmg:[1,6,0],xp:30,gold:2,lantern:1,v:`throws a snowball at`,intro:`A snowman spins around. Its carrot nose twitches. "You lookin' at my NOSE?"`,bye:`The snowman melts into a puddle. His carrot rolls away, looking embarrassed.`},
  weasel:{n:`Ice Weasel`,i:`🦦`,hp:8,ac:13,atk:4,dmg:[1,6,0],xp:30,gold:3,v:`nibbles angrily at`,intro:`A weasel made of pure attitude pops out of a snowbank. It is wearing a tiny helmet. It hisses at you.`,bye:`The ice weasel shrieks something very rude in Weasel and scurries away.`},
  icebat:{n:`Frost Bat`,i:`🦇`,hp:8,ac:13,atk:4,dmg:[1,4,1],xp:30,gold:1,v:`dive-bombs`,intro:`A frost bat swoops down screaming "EEEEEE!" Either that's a battle cry, or it stubbed its wing.`,bye:`The frost bat flaps away, still screaming. It screams the whole way home.`},
  yeti:{n:`Kevin the Yeti`,i:`🦍`,hp:16,ac:12,atk:4,dmg:[1,8,1],xp:60,gold:3,v:`swings his giant hairy arms at`,intro:`"RAAAAH! FEAR THE TERRIBLE YETI!" Kevin beats his chest, then coughs a little.`,bye:`Kevin flops down in the snow and pouts. "Fine. FINE. You win. Nobody respects yetis anymore." He drops 3 gold he found in his fur and stomps off.`},
  imps:{n:`Ice Imp Gang`,i:`👿`,hp:18,ac:12,atk:4,dmg:[2,4,1],xp:90,gold:8,lantern:1,v:`all throw icicles at`,intro:`Three ice imps jump out yelling "SURPRISE!" One of them is holding a sign that says SURPRISE.`,bye:`The imps all lick the same icicle at the same time, get their tongues stuck together, and hop away in a bundle.`},
  fridge:{n:`The Fridge Mimic`,i:`🧊`,hp:22,ac:12,atk:5,dmg:[1,8,2],xp:120,gold:0,v:`slams its door teeth at`,intro:`The fridge door swings open. Inside: teeth. SO many teeth. And one really old yogurt.`,bye:`The Fridge Mimic slams shut and goes quiet. The old yogurt is somehow still moving. You decide not to ask.`},
  golem:{n:`Chad the Ice Golem`,i:`🗿`,hp:26,ac:15,atk:5,dmg:[2,6,1],xp:200,gold:0,boss:1,lantern:1,v:`flexes first, then punches`,intro:`"Bro. BRO. You did NOT just try to skip the line." Chad cracks his icy knuckles.`,bye:`Chad crumbles into a pile of ice cubes. "Bro..." he whispers. "...respect." The big doors swing open.`},
  lich:{n:`Sir Brrrnard the Frost Lich`,i:`🥶`,hp:42,ac:14,atk:6,dmg:[2,6,2],xp:400,gold:0,boss:1,lantern:1,breath:1,
    bt:`Sir Brrrnard spins his icicle staff and unleashes a howling BLIZZARD!`,tele:`Sir Brrrnard starts doing a weird frosty dance... a blizzard is building up!`,
    v:`zaps you with his freezy staff`,intro:`"MWAHAHA! Ahem. Sorry, let me do that again. MWAHAHAHAHA!" Sir Brrrnard raises his icicle staff.`,
    bye:`Sir Brrrnard wobbles. "Curses! Beaten by a RECRUIT! And I never even finished my organ song!" He collapses into a pile of snow, bones, three scarves and four hats.`},
};
const MINOR=['snowman','weasel','icebat'];
const RIDDLES=[
  [`What do snowmen eat for breakfast?`,`Frosted Flakes`,[`Snow cones`,`Ice-cream pancakes`]],
  [`Where do snowmen keep their money?`,`In a snow bank`,[`In a piggy bank`,`Under their carrot`]],
  [`What falls all winter but never gets hurt?`,`Snow`,[`A penguin`,`My grades`]],
  [`What gets BIGGER the more you take away from it?`,`A hole`,[`A snowman`,`A pizza`]],
  [`What has lots of needles but never sews?`,`A pine tree`,[`A porcupine`,`Grandma`]],
  [`What kind of room has no doors and no windows?`,`A mushroom`,[`An igloo`,`A bathroom`]],
  [`I'm light as a feather, but the strongest warrior can't hold me for long. What am I?`,`Your breath`,[`A snowflake`,`A sock`]],
  [`What has a bottom at the top?`,`Your legs`,[`A snowman`,`A mountain`]],
  [`What can fill a whole room but takes up no space at all?`,`Light`,[`A yeti`,`A smell`]],
  [`What runs but never walks, and stops when it gets too cold?`,`A river`,[`A yeti`,`A runny nose`]],
];
const SHOP=[
  {k:'potion',n:`Hot Cocoa Potion`,d:`Heals 2d4+2 HP. Has tiny marshmallows. Works in battle too.`,p:10},
  {k:'rope',n:`Ice Axe & Rope`,d:`For climbing ice, chopping ice, and generally bossing ice around.`,p:5,max:1},
  {k:'luck',n:`Lucky Frozen Fish`,d:`Reroll one failed check. Smells lucky. Used up after.`,p:12,max:1},
];

const N={
hall:{t:`The Frostguard Mead Hall`,i:`🛡️`,cp:1,en:s=>s.flags.tv=(s.flags.tv||0)+1,
  x:s=>s.flags.tv>1?`The Frostguard warriors are arm-wrestling, ice-bathing, and headbutting each other for fun. Jarl Bjorn's beard owls hoot at you impatiently.\n\n"The MUG, recruit! My toes are turning into popsicles!"`
  :`Welcome to Frostbottom, the coldest village in the world. It's so cold here that the dogs wear sweaters, the sweaters wear sweaters, and the Frostguard ice warriors take baths in ice water. (Mostly because the hot water hasn't worked since the year 1047.)\n\nToday is your first day as a Frostguard recruit, ${s.name}. The leader of the Frostguard, Jarl Bjorn Frostbottom, stomps over. His beard is so big that two owls live in it. They pay rent.\n\n"RECRUIT! Disaster! The evil Frost Lich, Sir Brrrnard, has stolen the EVERWARM MUG! It's the magic cocoa mug that keeps our village from freezing solid! Without it, it's getting so cold that our WORDS are freezing in the air!"\n\nAs he talks, his words freeze and fall onto the table. Clink. Clink. CLINK.\n\n"SEE?! Get the Mug back from the Glacier Fortress and I'll make you a real Frostguard warrior. Plus 100 gold. Plus a free hat."`,
  c:s=>[{t:`Ask Skald Ragnar what he knows`,if:!s.flags.rumors,go:'rumors'},{t:`Visit Grandma Grizelda's Igloo Emporium`,go:'shop'},{t:`March out into the Frozen Wastes`,go:'tundra'}]},
rumors:{t:`Skald Ragnar the Off-Key`,i:`🎻`,en:s=>s.flags.rumors=1,
  x:s=>`Ragnar is the Frostguard's bard. He insists on singing EVERYTHING. His voice sounds like a moose stepping on a bagpipe.\n\n♪ "Ohhhh, the Lich lives in the Glacier Fortress, way up on the hiiiill..."\n\n♪ "A snowman guards the pass with riddles, so bring your thinking skiiiill..."\n\n♪ "The penguins in his dungeon know the secret password woooord..."\n\n♪ "And the Lich is cold ALL THE TIME, which is honestly absuuuurd!"\n\nRagnar bows. Nobody claps. A dog howls in the distance.`,
  c:s=>[{t:`Back to the mead hall (quickly, before he does an encore)`,go:'hall'}]},
shop:{t:`Grandma Grizelda's Igloo Emporium`,i:`🧶`,type:'shop',
  x:s=>`Grandma Grizelda is 104 years old. She knits faster than a sewing machine and once punched a polar bear for cutting in line. Her igloo is stuffed with supplies, and also about four hundred hand-knitted sweaters.\n\n"Hello, sweetie! Buy something or sit down and eat a cookie. You're too skinny for a warrior."`,
  c:s=>[{t:`Compliment Grandma's knitting`,if:!s.flags.sweater,check:{st:'wis',dc:10,
      pass:s=>{s.flags.sweater=1;s.inv.potion++;return{go:'shop',note:`"Oh, you sweet thing!" Grandma gives you her very best sweater. It's bright green with a reindeer on it that looks exactly like a potato. She throws in a free Hot Cocoa Potion too. You got: Grandma's Ugly Sweater!`}},
      fail:s=>{s.flags.sweater=1;hurt(1);return{go:'shop',note:`"Wow, what a nice... uh... blanket?" Grandma squints. "It's a SWEATER." She gives it to you anyway and pinches your cheek REALLY hard (−1 HP). You got: Grandma's Ugly Sweater! The reindeer on it looks like a potato.`}}}},
    {t:`Back to the mead hall`,go:'hall'}]},
tundra:{t:`The Frozen Wastes`,i:`🏔️`,
  x:s=>`Outside Frostbottom, everything is white. White snow. White sky. White hills. A snowflake lands on your nose and you almost cry, because it's the most exciting thing you've seen in an hour.\n\nSuddenly a giant shaggy shape bursts out of a snowdrift! It's a YETI! Nine feet tall, covered in white fur, with big yellow teeth.\n\n"RAAAAAH! I am the TERRIBLE YETI! Tremble before me, tiny warrior!"\n\nThere's a sticker on his fur. It says: HELLO MY NAME IS KEVIN.`,
  c:s=>[{t:`Fight Kevin!`,fight:'yeti',win:'hut'},
    {t:`Find Kevin's tickle spot`,check:{st:'dex',dc:12,pass:{go:'hut',note:`You find the tickle spot under his arm. Kevin giggles so hard he falls over and rolls down the hill like a giant furry snowball. "NOT THE TICKLE SPOOOOT!" Bye, Kevin!`},
      fail:{fight:'yeti',win:'hut',note:`You reach for his armpit. Kevin grabs your wrist. "Nobody. Touches. The tickle spot." Uh oh.`}}},
    {t:`Challenge him to a snowball fight`,check:{st:'str',dc:12,
      pass:s=>{s.gold+=5;return{go:'hut',note:`SPLAT! You nail Kevin right in the face. He's so impressed he gives you a hug that cracks your back, plus 5 gold he found in his fur. "Best snowball fight EVER. Don't tell anyone I lost."`}},
      fail:{fight:'yeti',win:'hut',note:`Kevin makes a snowball the size of a car. You can see where this is going.`}}}]},
hut:{t:`Gerald's Ice-Fishing Hut`,i:`🦭`,cp:1,
  x:s=>`You stumble into a little ice-fishing hut with a warm, crackling stove. Inside is a walrus wearing a tiny bow tie and holding a microphone.\n\n"Hello, hello! I'm Gerald! I'm a stand-up comedian! Well, a SIT-down comedian. I'm a walrus. Standing is hard."\n\nThere's a cozy bunk in the corner and a hole in the ice where Gerald fishes for snacks.`,
  c:s=>[{t:`Warm up by the stove and take a nap`,if:!s.flags.hutRest,act:s=>{s.flags.hutRest=1;rest(s)},go:'hut',note:`You snuggle up by the stove and nap like a sleepy bear. Health and abilities fully restored!`},
    {t:`Listen to Gerald's comedy show`,if:!s.flags.joke,act:s=>{s.flags.joke=1;s.inv.potion++},go:'hut',note:`"Why did the walrus go to the party? To have a WHALE of a time! Get it? Because I'm like a whale, but smaller... with a mustache." Nobody laughs. Not even the fish. Gerald is so grateful you stayed that he gives you a Hot Cocoa Potion.`},
    {t:`Go fishing in the ice hole`,if:!s.flags.fished,check:{st:'wis',dc:11,
      pass:s=>{s.flags.fished=1;s.gold+=10;return{go:'hut',note:`You catch a fish! It's wearing a top hat and holding 10 gold coins. "Keep the change," says the fish, and dives back in.`}},
      fail:s=>{s.flags.fished=1;hurt(2);return{go:'hut',note:`You catch an old boot. Inside the boot is a smaller boot. Inside THAT boot is a crab, who pinches your nose (−2 HP).`}}}},
    {t:`Head for Icicle Pass`,go:'pass'}]},
pass:{t:`Sir Flakes-a-Lot`,i:`☃️`,type:'riddle',en:s=>{if(!s.flags.passDone)pickRiddle(s)},done:s=>s.flags.passDone,
  x:s=>s.flags.passTries?`Sir Flakes-a-Lot adjusts his monocle. "Very well, peasant. ONE more try."`:`The trail squeezes between two cliffs of blue ice. Blocking the way is a snowman. A FANCY snowman, with a monocle, a top hat, and a mustache made of frozen spaghetti.\n\n"HALT, peasant! I am Sir Flakes-a-Lot, the Riddling Snowman! None may pass unless they answer my riddle. Or unless they have a hair dryer. Do you have a hair dryer? ...No? Then it's RIDDLE TIME!"`,
  ok:s=>{s.flags.passDone=1;s.flags.scarf=1;s.ac+=1;return{go:'fortress',note:`"Correct! Jolly good show!" Sir Flakes-a-Lot hands you his lucky scarf. Snowman's Scarf: +1 Armor! He scoots aside so you can pass.`}},
  bad:s=>{s.flags.passTries=(s.flags.passTries||0)+1;if(s.flags.passTries<2)return{go:'pass',note:`"WRONG! Hahaha!" Sir Flakes-a-Lot laughs so hard his monocle pops out.`};
    s.flags.passDone=1;const d=dice(1,4);hurt(d);return{go:'fortress',note:`"Wrong AGAIN! Oh, I've had my fun. Off you go." He sneezes, and his carrot nose shoots out and bonks you on the head (−${d} HP).`}},
  c:s=>[{t:`Tell him he's looking a little... melty`,check:{st:'int',dc:14,
    pass:s=>{s.flags.passDone=1;return{go:'fortress',note:`"MELTY?! WHERE?!" Sir Flakes-a-Lot shrieks and runs off to find a mirror. Except he has no legs. So he rolls. Very slowly. You walk right past.`}},
    fail:{go:'pass',note:`"Nice try, peasant. I have a cold heart. Literally. Now, RIDDLE!"`}}}]},
fortress:{t:`The Glacier Fortress`,i:`🏰`,cp:1,
  x:s=>{const n=['penguins','slide','kitchen'].filter(k=>s.flags[k]).length;
    return `The Glacier Fortress is a giant castle of blue ice with spiky towers and a slide instead of stairs. Over the door hangs a sign: NO HOT DRINKS. NO SUMMER. NO FUN. (Signed, Management.)\n\nInside, three hallways split off. To the left, you hear sad honking. Straight ahead is a hallway so shiny and slippery it's basically a mirror. To the right, a sign says KITCHEN, and something smells like very, very old cheese.\n\nFrom deep inside the fortress, someone is playing really bad organ music. Dun dun DUNNNNN.${n?`\n\nYou've explored ${n} of the 3 hallways.`:''}`},
  c:s=>{const n=['penguins','slide','kitchen'].filter(k=>s.flags[k]).length;return[
    {t:`Follow the sad honking`,if:!s.flags.penguins,go:'penguins',rand:.4},
    {t:`Try the super-slippery hallway`,if:!s.flags.slide,go:'slide',rand:.4},
    {t:`Follow the cheese smell to the kitchen`,if:!s.flags.kitchen,go:'kitchen',rand:.4},
    {t:`Follow the terrible organ music`,go:'gate',tag:n<2?'Boss ahead':null,hint:n<2?'Tip: explore more first to find treasure, a buddy, and level up.':null}]}},
penguins:{t:`The Penguin Dungeon`,i:`🐧`,en:s=>s.flags.penguins=1,
  x:s=>`Inside a cage made of icicles is a whole army of penguins in tiny suits of armor. They honk sadly.\n\nThe smallest one, whose helmet keeps sliding down over his eyes, waddles up to the bars. "Hark! I am Sir Waddlesworth, Penguin Knight of the Frostguard! The Lich captured my whole squad! Free us and we shall fight at thy side! Also, we are VERY hungry."\n\nAn ice imp is asleep in front of the cage, holding the key. He's snoring so loud that icicles are falling off the ceiling.`,
  c:s=>{const free=s=>{s.flags.ally=1;return{go:'fortress',note:`The cage pops open and fifty penguins pour out cheering "HONK HONK HOORAY!" Most of them waddle home for fish sticks, but Sir Waddlesworth salutes you. "I shall join thee! And I know the secret password to the Lich's throne room. It's FLUFFY SOCKS." Sir Waddlesworth will now fight beside you.`}};return[
    {t:`Tiptoe over and steal the key`,check:{st:'dex',dc:13,pass:free,fail:{fight:'imps',win:free,note:`The imp wakes up. So do his two brothers, who were sleeping UNDER him.`}}},
    {t:`Chop the bars with your ice axe`,if:!!s.inv.rope,go:free},
    {t:`Wake the imp up and fight!`,fight:'imps',win:free},
    {t:`Back to the fortress entrance`,go:'fortress'}]}},
slide:{t:`The Hall of Slippery Doom`,i:`⛸️`,en:s=>s.flags.slide=1,
  x:s=>`This hallway is made of perfectly smooth ice. At the far end, on a pedestal, sits a weapon wrapped in a cozy little flame that somehow doesn't melt anything.\n\nA sign on the wall says: NO RUNNING. Underneath, someone has scratched: NO WALKING EITHER. GOOD LUCK LOL.`,
  c:s=>[{t:`Walk very, very carefully`,check:{st:'wis',dc:12,pass:{go:'slideloot',note:`Tiny step. Tiny step. Tiny wobble. TINY STEP. You make it! It took eleven minutes, but you make it.`},
      fail:s=>{const d=dice(1,6);hurt(d);return{go:'slideloot',note:`Your feet fly out from under you. You zoom down the hall on your bottom, bounce off a wall, spin like a top, and crash into the pedestal (−${d} HP). Well, you got there.`}}}},
    {t:`Belly-slide like a penguin`,check:{st:'dex',dc:10,pass:{go:'slideloot',note:`WHEEEEEEE! You zoom down the hall, bounce off three walls, do a triple spin, and stop EXACTLY at the pedestal. The judges give you a perfect 10.`},
      fail:s=>{const d=dice(2,4);hurt(d);return{go:'slideloot',note:`WHEEEE- BONK. You hit the wall face first. Your face is now a little flatter (−${d} HP). But you did end up at the pedestal!`}}}},
    {t:`Back to the fortress entrance`,go:'fortress'}]},
slideloot:{t:`The Pedestal`,i:`🔥`,en:s=>s.flags.silver=1,
  x:s=>`You grab the weapon. It's a ${silverName(s)}, warm as a fresh cookie and glowing like a campfire. Your hands haven't been this warm in years. You might cry a little. That's okay.\n\nYour attacks now do +2 damage!`,
  c:s=>[{t:`Back to the fortress entrance`,go:'fortress'}]},
kitchen:{t:`The Lich's Kitchen`,i:`🧀`,en:s=>s.flags.kitchen=1,
  x:s=>`The kitchen is a disaster. Frozen pizzas are stacked to the ceiling. There's a lake of spilled milk frozen to the floor. In the corner is a cheese so stinky it has its own little rain cloud.\n\n${s.flags.lantern?'':`On the very top shelf is a jar labeled DEFINITELY NOT THE EVERWARM MUG. Something inside is glowing warm and orange.\n\n`}${s.flags.fridge?'The Fridge Mimic lies still in the corner. The yogurt is watching you.':'There\'s also a big shiny fridge humming in the corner. A fridge. In an ICE castle. Suspicious.'}`,
  c:s=>[{t:`Climb the shelves to reach the jar`,if:!s.flags.lantern,check:{st:'str',dc:12,
      pass:s=>{s.flags.lantern=1;return{go:'kitchen',note:`You climb up, open the jar, and there it is: the EVERWARM MUG, full of magic cocoa that never runs out! You can splash it on ice monsters in battle.`}},
      fail:s=>{s.flags.lantern=1;const d=dice(1,4);hurt(d);return{go:'kitchen',note:`The shelf collapses and you land in a pile of frozen pizzas (−${d} HP)... but the jar lands right in your lap. It's the EVERWARM MUG! You can splash it on ice monsters in battle.`}}}},
    {t:`Open the fridge`,if:!s.flags.fridge,fight:'fridge',win:s=>{s.flags.fridge=1;s.gold+=25;s.inv.potion++;return{go:'kitchen',note:`Inside the Fridge Mimic you find 25 gold, a Hot Cocoa Potion, and a note that says "PLEASE STOP OPENING ME."`}}},
    {t:`Sniff the stinky cheese`,if:!s.flags.cheese,act:s=>{s.flags.cheese=1;hurt(1);gainXP(10)},go:'kitchen',note:`You sniff the cheese. Your eyebrows try to leave your face. Your eyes water. Your ancestors feel it. (−1 HP, but +10 XP for bravery.)`},
    {t:`Back to the fortress entrance`,go:'fortress'}]},
gate:{t:`The Throne Room Door`,i:`🚪`,cp:1,
  x:s=>`The organ music is SO loud here. Dun dun DUNNNN. Dun dun... wrong note... DUNNNNN.\n\nIn front of a giant door stands an ice golem with huge muscles, sunglasses, and a tank top. He's drinking a protein shake. It's frozen. He's chewing it.\n\n"Sup. I'm Chad. I'm the bouncer. No password, no party, bro."\n\nNext to the door is a little bench with a heated seat. Somebody in this castle clearly gets cold.`,
  c:s=>[{t:`Sit on the heated bench and rest`,if:!s.flags.gateRest,act:s=>{s.flags.gateRest=1;rest(s)},go:'gate',note:`Ahhhh. Warm bottom, warm heart. Health and abilities fully restored!`},
    {t:`Say "FLUFFY SOCKS"`,if:!!s.flags.ally,go:'throne',note:`Chad lowers his sunglasses. "...Correct, bro." He opens the door. Sir Waddlesworth does a victory waddle.`},
    {t:`Guess the password`,check:{st:'wis',dc:15,pass:{go:'throne',note:`"Um... PLEASE?" Chad stares at you. "Bro. Nobody EVER says please. That's so polite. Go on in, bro."`},fail:{fight:'golem',win:'throne',note:`"Is it... PICKLES?" Chad shakes his head slowly. "Wrong game, bro."`}}},
    {t:`Fight Chad!`,fight:'golem',win:'throne'}]},
throne:{t:`Sir Brrrnard's Throne Room`,i:`🥶`,cp:1,
  x:s=>`The throne room is a giant ice cave with icicle chandeliers and a sad little tree with one ornament on it. At a huge organ made of icicles sits a skeleton in a frosty crown. He's wearing three scarves, four hats, and mittens on his FEET.\n\nHe spins around. "WHO DARES INTERRUPT MY ORGAN PRACTICE?! I am SIR BRRRNARD, the Frost Lich! Soon I shall freeze the whole world FOREVER! No more summer! No more beaches! No more SUMMER VACATION! MWAHAHA!"\n\nHis teeth chatter. "Brrrr. Is it cold in here, or is it just me?"${s.flags.ally?`\n\nSir Waddlesworth raises his tiny sword. "Have at thee, bone-face!"`:''}`,
  c:s=>[{t:`Offer him Grandma's ugly sweater`,if:!!s.flags.sweater,act:s=>s.flags.peace=1,go:'victory'},
    {t:`Ask him why he hates summer so much`,if:!s.flags.asked,check:{st:'wis',dc:13,
      pass:s=>{s.flags.asked=1;return{go:'throne',note:`Sir Brrrnard sniffles. "Because I'm a SKELETON! I have no skin! I'm ALWAYS cold! If I can't be warm, NOBODY gets to be warm!" Huh. Sounds like what this guy really needs is ${s.flags.sweater?'a sweater. Hey, wait. You HAVE a sweater!':'a sweater. Too bad you don\'t have one. Looks like it\'s fight time.'}`}},
      fail:{fight:'lich',win:'victory',note:`"SILENCE! No more talking! ORGAN BATTLE MUSIC, START!" Nothing happens. He's the one who plays the organ. He attacks anyway.`}}},
    {t:`Battle Sir Brrrnard!`,fight:'lich',win:'victory',hint:s.flags.lantern?'Tip: ice monsters HATE hot cocoa. Splash the Everwarm Mug in the fight!':null}]},
victory:{t:`Official Frostguard Warrior`,i:`🏆`,type:'end',en:s=>{s.gold+=100;const w=store.get(WINS)||{};w[s.cls]=(w[s.cls]||0)+1;store.set(WINS,w);store.del(SAVE)},
  x:s=>`${s.flags.peace?`You hold out Grandma Grizelda's ugly sweater. Sir Brrrnard gasps. "Is that... a reindeer that looks like a potato?"\n\nHe pulls it on over his skull. His teeth stop chattering. "Oh. Oh, that's NICE. It's so warm..." A tear freezes on his cheekbone. "I don't want to freeze the world anymore. I just want to sit here and be cozy."\n\n${s.flags.lantern?'':'He hands you the Everwarm Mug. '}Then he goes back to playing the organ. Still badly. But happily. You saved everyone without a fight. That's a real hero move.\n\n`:s.flags.lantern?'':`In the pile of snow and hats, you find the Everwarm Mug, still steaming.\n\n`}You march home to Frostbottom with the Everwarm Mug${s.flags.ally?' and Sir Waddlesworth riding on your shoulder':''}. The moment you put the Mug back in the village square, warm air whooshes through the streets.\n\nAnd then all the words that froze last week thaw out AT THE SAME TIME.\n\n"PASS THE SALT!" "WHERE ARE MY PANTS?!" "WHO ATE MY SANDWICH?" "I'M NOT CRYING, YOU'RE CRYING!" "SERIOUSLY, WHERE ARE MY PANTS?!"\n\nWhen it finally gets quiet, Jarl Bjorn puts a hand on your shoulder. "${s.name}, you are now an official FROSTGUARD WARRIOR!" He hands you 100 gold and your free hat: a horned helmet with two cupholders. The beard owls hoot proudly.${s.flags.ally?`\n\nSir Waddlesworth is promoted to Penguin Captain. He still can't see out of his helmet.`:''}\n\nKevin the Yeti joins the Frostguard too. He's in charge of tickle defense.${s.flags.peace?`\n\nA month later, a postcard arrives. It shows a skeleton in an ugly green sweater on a sunny beach. It says: WISH YOU WERE HERE. STILL A LITTLE CHILLY. LOVE, BRRRNARD.`:`\n\nSome say that on cold nights, a pile of snow on Glacier Hill whispers, "Brrrrr..." Maybe all he ever needed was a sweater. Maybe there's another way this story could end.`}`},
};

const $=s=>document.querySelector(s);
const R=n=>1+Math.floor(Math.random()*n);
const dice=(c,d,b=0)=>{let t=b;for(let i=0;i<c;i++)t+=R(d);return t};
const sign=n=>(n>=0?'+':'−')+Math.abs(n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SAVE=GAME.key+'_save_v2', WINS=GAME.key+'_wins_v1';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const STATN={str:'Strength',dex:'Dexterity',int:'Intelligence',wis:'Wisdom'};
const CL={
  fighter:{name:'Fighter',i:'🛡️',blurb:'Tough as nails. Big sword, heavy armor, hard to knock down.',hp:14,lv:7,ac:16,st:{str:3,dex:1,int:0,wis:0},
    wpn:{n:'Longsword',c:1,d:8,s:'str'},sw:'Longsword',sp:{n:'Second Wind',d:'Heal 1d10 + your level',uses:2,k:'heal'}},
  ranger:{name:'Ranger',i:'🏹',blurb:'Expert tracker and archer. Marks a target and never lets it go.',hp:12,lv:6,ac:14,st:{str:1,dex:3,int:0,wis:1},
    wpn:{n:'Longbow',c:1,d:8,s:'dex'},sw:'Longbow',sp:{n:'Hunter\'s Mark',d:'Mark the monster and shoot. Every hit this fight does +1d6',uses:2,k:'mark'}},
  rogue:{name:'Rogue',i:'🗡️',blurb:'Sneaky and quick. Great at tricks, traps and surprise attacks.',hp:11,lv:6,ac:14,st:{str:0,dex:3,int:1,wis:1},
    wpn:{n:'Shortsword',c:1,d:6,s:'dex'},sw:'Shortsword',sp:{n:'Sneak Attack',d:'Roll twice, keep the best. +2d6 damage on a hit',uses:2,k:'sneak'}},
  druid:{name:'Druid',i:'🌿',blurb:'Nature magic. Lashes foes with thorns and can turn into a bear!',hp:10,lv:6,ac:13,st:{str:0,dex:1,int:1,wis:3},
    wpn:{n:'Thorn Whip',c:1,d:8,s:'wis'},sw:'Oak Staff',sp:{n:'Wild Shape: Bear',d:'Become a bear! Gain 2d6 + level bonus HP and +2 damage this fight',uses:2,k:'bear'}},
  wizard:{name:'Wizard',i:'🔮',blurb:'Fragile but brilliant. Throws fire and magic darts that never miss.',hp:9,lv:5,ac:12,st:{str:-1,dex:1,int:3,wis:1},
    wpn:{n:'Fire Bolt',c:1,d:10,s:'int'},sw:'Wand',sp:{n:'Magic Missile',d:'3 glowing darts that never miss (1d4+1 each)',uses:3,k:'missile'}},
  cleric:{name:'Cleric',i:'☀️',blurb:'Holy warrior. Heals wounds and burns monsters with sacred fire.',hp:11,lv:6,ac:15,st:{str:1,dex:0,int:0,wis:3},
    wpn:{n:'Sacred Flame',c:1,d:8,s:'wis'},sw:'Holy Symbol',sp:{n:'Cure Wounds',d:'Heal 1d8 + 3 + your level',uses:2,k:'cure'}},
};
const RACES={
  human:{name:'Human',i:'🧑',blurb:'Brave and adaptable.',st:{str:1,dex:1,int:1,wis:1},perk:'Versatile: +1 to every ability.'},
  elf:{name:'Elf',i:'🧝',blurb:'Graceful forest folk with sharp eyes.',st:{dex:2,wis:1},perk:'Keen Senses: +2 extra on Wisdom checks.'},
  tiefling:{name:'Tiefling',i:'😈',blurb:'Horns, a tail, and fire in the blood.',st:{int:2,wis:1},perk:'Hellish Rebuke: the first time a monster hits you in a fight, flames burn it for 2d6.'},
  dwarf:{name:'Dwarf',i:'🧔',blurb:'Stout, stubborn, and hard as stone.',st:{str:2,wis:1},perk:'Dwarven Toughness: +3 HP, plus 1 more every level.'},
  halfling:{name:'Halfling',i:'🧒',blurb:'Small, cheerful, and amazingly lucky.',st:{dex:2,int:1},perk:'Lucky: start with a free lucky charm to reroll a failed check.'},
  dragonborn:{name:'Dragonborn',i:'🐲',blurb:'Proud dragon folk with scales of bronze.',st:{str:2,wis:1},perk:'Dragon Breath: once per fight, breathe fire for 2d6 + level damage.'},
};
const heroStats=(c,r)=>{const o={...CL[c].st};for(const k in RACES[r].st)o[k]+=RACES[r].st[k];return o};
const silverName=s=>GAME.silver+' '+CL[s.cls].sw;

let S=null, C=null, busy=false, screen='title', cur=[];
const cls=()=>CL[S.cls], race=()=>RACES[S.race];
const toHit=()=>S.st[cls().wpn.s]+(S.lvl>=3?3:2)+(S.diff==='easy'?2:0);
const dmgB=()=>S.st[cls().wpn.s]+(S.flags.silver?2:0)+(C&&C.bear?2:0);
const wpnName=()=>S.flags.silver?silverName(S):cls().wpn.n;
function hurt(n){S.hp=Math.max(1,S.hp-n)}
function heal(n){const b=S.hp;S.hp=Math.min(S.max,S.hp+n);return S.hp-b}
function rest(s){s.hp=s.max;s.uses=CL[s.cls].sp.uses}
const LV=[0,100,300,600,1000];
function gainXP(n){S.xp+=n;let out='';while(S.lvl<5&&S.xp>=LV[S.lvl]){S.lvl++;const g=cls().lv+(S.race==='dwarf'?1:0);S.max+=g;S.hp=S.max;S.uses=cls().sp.uses;
  out+=`<div class="lvup">LEVEL UP! You are now level ${S.lvl}. +${g} max HP${S.lvl===3?', and your attacks get more accurate':''}. Health and abilities restored!</div>`}return out}
function pickRiddle(s){let used=s.flags.used||[];let av=RIDDLES.map((_,i)=>i).filter(i=>!used.includes(i));if(!av.length){used=[];av=RIDDLES.map((_,i)=>i)}
  const i=pick(av);used.push(i);s.flags.used=used;s.flags.rq=i;s.flags.ro=shuffle([RIDDLES[i][1],...RIDDLES[i][2]])}

/* ---------- FLOW ---------- */
function save(){if(S&&S.node!=='victory')store.set(SAVE,S)}
function makeCp(){S.cp=null;S.cp=JSON.stringify(S)}
function restoreCp(){const cp=S.cp;S=JSON.parse(cp);S.cp=cp;rest(S);S.mode='story';S.note='Everything went dark... then a warm voice whispered, "Not yet, hero." You wake up at your last safe spot, fully healed. Let\'s try that again!';C=null;busy=false;save();render()}
function go(t,note){
  if(typeof t==='function')t=t(S);
  if(t&&typeof t==='object'){if(t.fight)return startCombat(t.fight,t.win,t.first,t.note||note);note=t.note||note;t=t.go}
  S.note=note||'';S.node=t;S.mode='story';const n=N[t];if(n.en)n.en(S);
  if(n.cp)makeCp();save();render();window.scrollTo(0,0);
  if(S.flags.pendingLv){const l=S.flags.pendingLv;S.flags.pendingLv='';msg('Level up!',l,'Awesome!')}
}
function choose(i){
  const ch=cur[i];if(!ch||busy)return;
  if(ch.cost){if(S.gold<ch.cost)return;S.gold-=ch.cost}
  if(ch.act)ch.act(S);
  if(ch.check)return doCheck(ch);
  if(ch.rand&&Math.random()<ch.rand)return startCombat(pick(MINOR),ch.go,0,'Something lurks in the tunnel ahead!');
  if(ch.fight)return go(ch);
  go(ch.go,ch.note);
}
function checkBonus(st){return S.st[st]+(S.race==='elf'&&st==='wis'?2:0)}
function doCheck(ch){const k=ch.check;
  rollD20({kind:'check',title:`${STATN[k.st]} check`,sub:ch.t,bonus:checkBonus(k.st),blabel:k.st.toUpperCase(),target:k.dc,tlabel:'needed'},ok=>go(ok?k.pass:k.fail))}

/* ---------- DICE OVERLAY ---------- */
const D20=`<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="var(--torch)" stroke="var(--dieline)" stroke-width="3"/><polygon points="50,24 79,70 21,70" fill="var(--torch2)" stroke="var(--dieline)" stroke-width="2"/><g stroke="var(--dieline)" stroke-width="2"><line x1="50" y1="3" x2="50" y2="24"/><line x1="93" y1="27" x2="79" y2="70"/><line x1="7" y1="27" x2="21" y2="70"/><line x1="93" y1="73" x2="79" y2="70"/><line x1="7" y1="73" x2="21" y2="70"/><line x1="50" y1="97" x2="79" y2="70"/><line x1="50" y1="97" x2="21" y2="70"/><line x1="7" y1="27" x2="50" y2="24"/><line x1="93" y1="27" x2="50" y2="24"/></g></svg>`;
function openOv(html){$('#ovbox').innerHTML=html;$('#ov').hidden=false}
function closeOv(){$('#ov').hidden=true}
function msg(title,body,btn,cb){openOv(`<h3>${title}</h3><div class="body">${body}</div><div class="btns"><button class="big" id="ovOk">${btn||'Continue'}</button></div>`);
  $('#ovOk').onclick=()=>{closeOv();cb&&cb()};$('#ovOk').focus()}
function rollD20(o,cb){
  openOv(`<h3>${o.title}</h3><div class="sub">${o.sub||''}</div>
   <div class="die" id="die">${D20}<span class="num" id="dn">20</span></div>
   <div class="res" id="dres">${o.kind==='check'?`Roll a d20 and add your ${o.blabel} bonus (${sign(o.bonus)}). You need ${o.target} or more.`:''}</div>
   <div class="verdict" id="dv"></div><div class="btns" id="db"></div>`);
  const db=$('#db');
  const spin=()=>{
    db.innerHTML='';$('#dv').textContent='';$('#dv').className='verdict';
    const die=$('#die');die.className='die spin';
    const r1=R(20),r2=o.adv?R(20):null,nat=r2?Math.max(r1,r2):r1;
    const dur=REDUCED?150:850;const t0=performance.now();
    const tick=()=>{if(performance.now()-t0<dur){$('#dn').textContent=R(20);setTimeout(tick,55)}else land()};
    const land=()=>{
      $('#dn').textContent=nat;die.className='die land'+(nat===20?' crit':nat===1?' fumble':'');
      const tot=nat+o.bonus;
      const ok=o.kind==='check'?(nat===20||tot>=o.target):(nat===20||(nat!==1&&tot>=o.target));
      $('#dres').innerHTML=`${r2?`You rolled ${r1} and ${r2}, keeping ${nat}.<br>`:''}${nat} ${sign(o.bonus)} ${o.blabel} = <b>${tot}</b> &nbsp;·&nbsp; ${o.tlabel} ${o.target}`;
      const v=$('#dv');
      if(nat===20){v.textContent=o.kind==='check'?'Natural 20!':'Critical hit!';v.classList.add('crit')}
      else if(nat===1&&o.kind!=='check'){v.textContent='Oops! Natural 1';v.classList.add('bad')}
      else{v.textContent=ok?(o.kind==='check'?'Success!':'Hit!'):(o.kind==='check'?'Failed!':'Miss!');v.classList.add(ok?'ok':'bad')}
      if(o.auto){let done=false;const fin=()=>{if(done)return;done=true;closeOv();cb(ok,nat)};
        db.innerHTML=`<button class="ghost" id="dgo">Continue</button>`;$('#dgo').onclick=fin;setTimeout(fin,REDUCED?900:1300);return}
      const canLuck=!ok&&S.inv.luck>0;
      db.innerHTML=(canLuck?`<button class="big" id="dluck">Use your ${GAME.luck} (reroll)</button>`:'')+`<button class="${canLuck?'ghost':'big'}" id="dgo">Continue</button>`;
      $('#dgo').onclick=()=>{closeOv();cb(ok,nat)};$('#dgo').focus();
      if($('#dluck'))$('#dluck').onclick=()=>{S.inv.luck--;$('#dres').textContent='Your lucky charm glows... roll again!';spin()};
    };
    tick();
  };
  if(o.kind==='check'){db.innerHTML=`<button class="big" id="droll">Roll the d20!</button>`;$('#droll').onclick=spin;$('#droll').focus()}else spin();
}

/* ---------- COMBAT ---------- */
function startCombat(id,win,first,note){
  const b=MON[id],easy=S.diff==='easy',hp=easy?Math.ceil(b.hp*.8):b.hp;
  C={id,m:{...b,hp,max:hp,atk:b.atk-(easy?1:0)},win,from:S.node,round:1,log:[],lan:false,hit:false,thp:0,bear:false,mark:false,breathUsed:false,rebuked:false};
  if(note)C.log.unshift({c:'n',t:note});C.log.unshift({c:'n',t:b.intro});
  if(first){const d=dice(cls().wpn.c,cls().wpn.d,dmgB());C.m.hp-=d;C.log.unshift({c:'p',t:`Free hit! You strike first for ${d} damage.`})}
  S.mode='combat';busy=false;render();window.scrollTo(0,0);
}
const log=(c,t)=>C.log.unshift({c,t});
function hitFoe(n){C.m.hp-=n;C.hit=true}
function attack(kind){
  if(busy)return;busy=true;const w=cls().wpn,sneak=kind==='sneak';if(sneak)S.uses--;render();
  rollD20({kind:'atk',title:sneak?'Sneak Attack!':(C.bear?'Bear Swipe!':wpnName()),sub:`vs ${C.m.n}`,bonus:toHit(),blabel:'',target:C.m.ac,tlabel:'Armor',adv:sneak,auto:1},(ok,nat)=>{
    if(ok){const cm=nat===20?2:1;let d=dice(w.c*cm,w.d,dmgB()),ex=[];
      if(sneak){const s=dice(2*cm,6);d+=s;ex.push(`${s} sneak`)}
      if(C.mark){const s=dice(cm,6);d+=s;ex.push(`${s} from Hunter's Mark`)}
      hitFoe(d);log('p',`${nat===20?'CRITICAL HIT! ':''}${C.bear?'Your giant bear claws hit':'Your '+wpnName()+' hits'} the ${C.m.n} for ${d} damage${ex.length?` (${ex.join(', ')})`:''}!`)}
    else log('p',nat===1?pick(['You trip over your own feet. Miss!','Your weapon slips out of your hand for a second. Miss!','You sneeze at the worst possible moment. Miss!']):`You miss the ${C.m.n}!`);
    after();
  });
}
function special(){
  if(busy||S.uses<1)return;const sp=cls().sp;
  if(sp.k==='sneak')return attack('sneak');
  if(sp.k==='mark'){if(C.mark)return;S.uses--;C.mark=true;log('p',`You fix your eyes on the ${C.m.n}. It's MARKED. It can't hide from you now!`);return attack('atk')}
  busy=true;S.uses--;
  if(sp.k==='bear'){if(C.bear){busy=false;S.uses++;return}const t=dice(2,6,S.lvl);C.thp+=t;C.bear=true;log('h',`You drop to all fours, fur bursts out, and you ROAR! You're a giant bear: +${t} bonus HP and +2 damage this fight.`)}
  else if(sp.k==='missile'){const a=[dice(1,4,1),dice(1,4,1),dice(1,4,1)],t=a[0]+a[1]+a[2];hitFoe(t);log('p',`Three glowing darts zip from your fingers: ${a.join(' + ')} = ${t} damage!`)}
  else{const n=sp.k==='heal'?dice(1,10,S.lvl):dice(1,8,3+S.lvl);const g=heal(n);log('h',sp.k==='heal'?`You catch your breath and power through. +${g} HP!`:`Healing light flows over your wounds. +${g} HP!`)}
  after();
}
function potion(){if(busy||S.inv.potion<1)return;busy=true;S.inv.potion--;const g=heal(dice(2,4,2));log('h',`${GAME.sip||'Glug glug. The potion tastes like cherries.'} +${g} HP!`);after()}
function relic(){if(busy||C.lan)return;busy=true;C.lan=true;const d=dice(3,8,2);hitFoe(d);log('p',`${GAME.relic.log} The ${C.m.n} shrieks: ${d} damage!`);after()}
function dbreath(){if(busy||C.breathUsed)return;busy=true;C.breathUsed=true;const d=dice(2,6,S.lvl);hitFoe(d);log('p',`You take a deep breath and blast a cone of dragon fire! ${d} damage!`);after()}
function flee(){if(busy||C.m.boss)return;busy=true;render();
  rollD20({kind:'atk',title:'Run away!',sub:'Dexterity check',bonus:S.st.dex,blabel:'DEX',target:12,tlabel:'needed',auto:1},ok=>{
    if(ok){const f=C.from;C=null;busy=false;go(f,'You run for it and get away! Phew.');return}
    log('n','You try to run, but you can\'t get away!');after()})}
function after(){
  render();
  if(C.m.hp<=0)return setTimeout(winFight,550);
  setTimeout(()=>{
    if(S.flags.ally){const d=dice(1,4,1);hitFoe(d);log('a',pick(GAME.ally.lines).replace('{d}',d));
      if(C.m.hp<=0){render();return setTimeout(winFight,550)}}
    foeTurn();C.round++;busy=false;render();
    if(C.m.hp<=0)return setTimeout(winFight,550);
    if(S.hp<=0)setTimeout(lose,600);
  },650);
}
function hurtP(d){
  if(C.thp>0){const a=Math.min(C.thp,d);C.thp-=a;d-=a;if(C.thp<=0&&C.bear){C.bear=false;log('n','POOF! Your bear form wears off and you turn back into yourself.')}}
  S.hp-=d;
}
function foeTurn(){
  const m=C.m;const before=S.hp+C.thp;let hit=false;
  if(m.breath&&C.round%3===0){const r=R(20),sv=r+S.st.dex;let d=dice(3,6);const ok=r===20||sv>=13;if(ok)d=Math.floor(d/2);hurtP(d);hit=true;
    log('m',`${m.bt} You dive for cover (${r}${sign(S.st.dex)} = ${sv} vs 13) ${ok?'and only get grazed':'but it catches you'}: ${d} damage!`)}
  else{const r=R(20),tot=r+m.atk;
    if(r===20||(r!==1&&tot>=S.ac)){const d=dice(m.dmg[0]*(r===20?2:1),m.dmg[1],m.dmg[2]);hurtP(d);hit=true;log('m',`${r===20?'Critical! ':''}The ${m.n} ${m.v} you for ${d} damage!`)}
    else log('n',`The ${m.n} ${m.v} you, but misses! (rolled ${tot} vs your Armor ${S.ac})`);
    if(m.breath&&C.round%3===2)log('n',m.tele)}
  if(hit&&S.race==='tiefling'&&!C.rebuked&&S.hp>0){C.rebuked=true;const d=dice(2,6);hitFoe(d);log('p',`Hellish Rebuke! Your eyes flash red and flames burst around the ${m.n}: ${d} damage!`)}
  if(S.hp+C.thp<before){document.body.classList.remove('ouch');void document.body.offsetWidth;document.body.classList.add('ouch')}
}
function winFight(){
  const m=C.m;S.kills[C.id]=(S.kills[C.id]||0)+1;S.gold+=m.gold;const lv=gainXP(m.xp);busy=false;
  msg('Victory!',`<p>${m.bye}</p><p><b>+${m.xp} XP</b>${m.gold?` &nbsp;·&nbsp; <b>+${m.gold} gold</b>`:''}</p>${lv}`,'Continue',()=>{const w=C.win;C=null;go(w)});
}
function lose(){busy=true;msg('You have fallen...','<p>The world spins, and everything goes dark.</p><p>But heroes don\'t give up that easily.</p>','Rise again',()=>restoreCp())}

/* ---------- RENDER ---------- */
const paras=t=>t.split('\n\n').map(p=>`<p>${p}</p>`).join('');
function renderBar(){
  const b=$('#bar');if(!S||screen!=='game'){b.hidden=true;return}b.hidden=false;const c=cls();
  const nx=S.lvl<5?LV[S.lvl]:S.xp,pv=LV[S.lvl-1],xpP=S.lvl<5?Math.round((S.xp-pv)/(nx-pv)*100):100;
  const thp=C&&C.thp>0?` <span class="thp">+${C.thp} bear</span>`:'';
  b.innerHTML=`<div class="bar-in"><button class="who" id="sheetBtn" aria-label="Open hero sheet"><span class="ico">${C&&C.bear?'🐻':c.i}</span><span><b>${S.name}</b><small>Lv ${S.lvl} ${race().name} ${c.name}</small></span></button>
   <div class="vitals"><div class="vit-row"><span>Health${thp}</span><span>${Math.max(0,S.hp)} / ${S.max}</span></div><div class="track"><i style="width:${Math.max(0,S.hp)/S.max*100}%"></i></div>
   <div class="track xp" title="Experience"><i style="width:${xpP}%"></i></div></div>
   <div class="purse"><span class="g">${S.gold} gold</span><span>🧪 ${S.inv.potion}</span></div></div>`;
  $('#sheetBtn').onclick=sheet;
}
function render(){
  renderBar();const m=$('#main');
  if(screen==='title')return renderTitle(m);
  if(screen==='create')return renderCreate(m);
  if(S.mode==='combat')return renderCombat(m);
  renderNode(m);
}
function renderNode(m){
  const n=N[S.node];let h=`<article class="card"><div class="scene-head"><div class="badge" aria-hidden="true">${n.i}</div><h2>${n.t}</h2></div>`;
  if(S.note)h+=`<div class="note"><span>What happened</span><p>${S.note}</p></div>`;
  h+=paras(n.x(S));
  if(n.type==='shop')h+=`<div class="shop">${SHOP.map((it,i)=>{const own=S.inv[it.k],full=it.max&&own>=it.max;
    return `<div class="item"><div><b>${it.n}${own?` <small>(you have ${own})</small>`:''}</b><small>${it.d}</small></div><button class="buy" data-buy="${i}" ${full||S.gold<it.p?'disabled':''}>${full?'Owned':it.p+' gold'}</button></div>`}).join('')}</div>`;
  const q=n.type==='riddle'?(n.q||RIDDLES[S.flags.rq]):null;
  if(q&&!(n.done&&n.done(S)))h+=`<div class="riddle"><q>${q[0]}</q><div class="opts">${S.flags.ro.map((o,i)=>`<button class="ch" data-r="${i}"><span class="arr">›</span><span class="lab">${o}</span></button>`).join('')}</div></div>`;
  if(n.type==='end'){const k=Object.values(S.kills).reduce((a,b)=>a+b,0);h+=`<div class="summary"><div><b>${S.lvl}</b><small>Level</small></div><div><b>${k}</b><small>Monsters beaten</small></div><div><b>${S.gold}</b><small>Gold</small></div></div>`}
  h+='</article>';
  cur=n.c?n.c(S).filter(c=>c.if!==false):[];
  if(cur.length){h+=`<div class="choices">${cur.map((c,i)=>{let tag='';
    if(c.check)tag=`<span class="tag chk">${c.check.st.toUpperCase()} ${c.check.dc}</span>`;else if(c.fight)tag=`<span class="tag bat">Battle</span>`;else if(c.cost)tag=`<span class="tag gold">${c.cost} gold</span>`;else if(c.tag)tag=`<span class="tag bat">${c.tag}</span>`;
    return `<button class="ch" data-c="${i}" ${c.cost&&S.gold<c.cost?'disabled':''}><span class="arr">›</span><span class="lab">${c.t}</span>${tag}</button>`}).join('')}</div>`;
    const hint=cur.find(c=>c.hint);if(hint)h+=`<div class="hint">${hint.hint}</div>`}
  if(n.type==='end')h+=`<div class="choices"><button class="big" id="again">Play again with a new hero</button></div><p class="hint">Can you win with all six classes? Try a different path too. There are secrets you haven't found yet.</p>`;
  m.innerHTML=h;
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>choose(+b.dataset.c));
  m.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=SHOP[+b.dataset.buy];if(S.gold<it.p)return;S.gold-=it.p;S.inv[it.k]++;S.note=`You bought: ${it.n}.`;save();render()});
  m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const ok=S.flags.ro[+b.dataset.r]===q[1];go(ok?n.ok:n.bad,ok?'':`The answer was: ${q[1]}.`)});
  if($('#again'))$('#again').onclick=()=>{S=null;screen='create';render()};
}
function renderCombat(m){
  const f=C.m,c=cls(),sp=c.sp,w=c.wpn,d=busy;
  const spOff=d||S.uses<1||(sp.k==='mark'&&C.mark)||(sp.k==='bear'&&C.bear);
  let h=`<article class="card"><div class="foe" id="foe"><div class="foe-ico" aria-hidden="true">${f.i}</div><h2>${f.n}</h2>
   <div class="track"><i style="width:${Math.max(0,f.hp)/f.max*100}%"></i></div><div class="foe-meta"><span>${Math.max(0,f.hp)} / ${f.max} HP</span><span>Armor ${f.ac}</span><span>Round ${C.round}</span></div>
   ${C.mark||C.bear?`<div class="status">${C.mark?'<span>Marked</span>':''}${C.bear?'<span>You are a bear</span>':''}</div>`:''}</div>
   <div class="acts">`;
  if(S.flags.lantern&&f.lantern&&!C.lan)h+=`<button class="act lan" id="aL" ${d?'disabled':''}><b>${GAME.relic.btn}</b><small>${GAME.relic.desc}</small></button>`;
  h+=`<button class="act main" id="aA" ${d?'disabled':''}><b>Attack: ${C.bear?'Bear Claws':wpnName()}</b><small>d20 ${sign(toHit())} to hit · ${w.c}d${w.d}${sign(dmgB())} damage${C.mark?' +1d6':''}</small></button>
   <button class="act" id="aS" ${spOff?'disabled':''}><b>${sp.n}</b><small>${sp.d} · ${S.uses} left</small></button>
   <button class="act" id="aP" ${d||S.inv.potion<1||S.hp>=S.max?'disabled':''}><b>Healing Potion</b><small>Heal 2d4+2 · ${S.inv.potion} left</small></button>
   ${S.race==='dragonborn'?`<button class="act" id="aB" ${d||C.breathUsed?'disabled':''}><b>Dragon Breath</b><small>2d6${sign(S.lvl)} fire damage · ${C.breathUsed?'used':'once per fight'}</small></button>`:''}
   <button class="act" id="aR" ${d||f.boss?'disabled':''}><b>Run away</b><small>${f.boss?'You can\'t run from a boss!':'Dexterity check, need 12'}</small></button>
   </div><div class="log" aria-live="polite">${C.log.slice(0,6).map(l=>`<div class="${l.c}">${l.t}</div>`).join('')}</div></article>`;
  m.innerHTML=h;
  if(C.hit){C.hit=false;$('#foe').classList.add('hit')}
  $('#aA').onclick=()=>attack('atk');$('#aS').onclick=special;$('#aP').onclick=potion;$('#aR').onclick=flee;
  if($('#aL'))$('#aL').onclick=relic;if($('#aB'))$('#aB').onclick=dbreath;
}
function sheet(){
  const c=cls(),items=[];if(S.inv.potion)items.push(`${S.inv.potion} Healing Potion${S.inv.potion>1?'s':''}`);if(S.inv.rope)items.push(SHOP.find(x=>x.k==='rope').n);if(S.inv.luck)items.push(GAME.luck);
  GAME.items.forEach(([f,l])=>{if(S.flags[f])items.push(l)});
  const k=Object.entries(S.kills).map(([id,n])=>`${MON[id].n}${n>1?' ×'+n:''}`).join(', ')||'None yet';
  msg(`${S.name}`,`<div style="text-align:center;color:var(--mute);font-weight:700">Level ${S.lvl} ${race().name} ${c.name} · ${S.xp} XP${S.lvl<5?` (next level at ${LV[S.lvl]})`:''}</div>
   <div class="sheet-stats">${Object.keys(STATN).map(s=>`<div><b>${sign(S.st[s])}</b><small>${s.toUpperCase()}</small></div>`).join('')}</div>
   <div class="kv"><div><span>Health</span><b>${S.hp} / ${S.max}</b></div><div><span>Armor</span><b>${S.ac}</b></div><div><span>Weapon</span><b>${wpnName()} (${c.wpn.c}d${c.wpn.d}${sign(dmgB())})</b></div>
   <div><span>${c.sp.n}</span><b>${S.uses} / ${c.sp.uses} left</b></div><div><span>${race().name} power</span><b>${race().perk}</b></div><div><span>Gold</span><b>${S.gold}</b></div><div><span>Items</span><b>${items.join(', ')||'Nothing'}</b></div>
   ${S.flags.ally?`<div><span>Companion</span><b>${GAME.ally.name}</b></div>`:''}<div><span>Monsters beaten</span><b>${k}</b></div></div>`,'Back to the adventure');
}
function renderTitle(m){
  const w=store.get(WINS)||{},sv=store.get(SAVE);
  m.innerHTML=`<div class="title"><div class="lantern" aria-hidden="true">${GAME.icon}</div><h1>${GAME.title}</h1><div class="tag-line">${GAME.tagline}</div>
   <div class="menu">${sv?`<button class="big" id="cont">Continue: ${sv.name} the ${RACES[sv.race].name} ${CL[sv.cls].name}</button><button class="ghost" id="nw">Start a new adventure</button>`:`<button class="big" id="nw">Start a new adventure</button>`}</div></div>
   <div class="trophies"><h3>Classes that beat the game</h3><div class="tro">${Object.entries(CL).map(([k,c])=>`<span class="${w[k]?'won':''}"><i>${c.i}</i>${c.name}</span>`).join('')}</div></div>
   <details><summary>How to play</summary><ul>
   <li>Read what happens, then tap a choice to decide what your hero does.</li>
   <li>Choices with a blue tag like <b>DEX 13</b> are checks. Roll a 20-sided die (d20) and add your bonus. Get 13 or more to succeed. A natural 20 always works!</li>
   <li>In battle, roll to hit. You need to match or beat the monster's Armor number.</li>
   <li>Your race gives you a special power, and your class gives you another. Try different combos!</li>
   <li>Win battles to earn XP and level up. Gold buys potions at the shop.</li>
   <li>If you fall, you'll wake up at the last safe spot. Your game saves itself as you go.</li>
   <li>Tap your hero's name at the top to see your hero sheet.</li></ul></details>`;
  $('#nw').onclick=()=>{screen='create';render()};
  if($('#cont'))$('#cont').onclick=()=>{S=sv;screen='game';S.mode='story';render()};
}
let pickC='fighter',pickR='human',pickD='normal',pickN='';
function renderCreate(m){
  const st=heroStats(pickC,pickR),hp=CL[pickC].hp+(pickR==='dwarf'?3:0);
  m.innerHTML=`<article class="card"><div class="scene-head"><div class="badge" aria-hidden="true">📜</div><h2>Create your hero</h2></div>
   <label class="f" for="hn">Hero name</label><input type="text" id="hn" maxlength="16" placeholder="Leave blank for a random name" value="${pickN}">
   <label class="f">Choose your race</label><div class="grid races">${Object.entries(RACES).map(([k,r])=>`<button class="cls ${k===pickR?'sel':''}" data-r="${k}"><span class="ci">${r.i}</span><b>${r.name}</b><small>${r.blurb}</small></button>`).join('')}</div>
   <div class="perk"><b>${RACES[pickR].name} power</b> ${RACES[pickR].perk}</div>
   <label class="f">Choose your class</label><div class="grid">${Object.entries(CL).map(([k,c])=>`<button class="cls ${k===pickC?'sel':''}" data-k="${k}"><span class="ci">${c.i}</span><b>${c.name}</b><small>${c.blurb}</small></button>`).join('')}</div>
   <div class="perk"><b>${CL[pickC].sp.n}</b> ${CL[pickC].sp.d}.</div>
   <div class="preview"><div class="pv-name">${RACES[pickR].name} ${CL[pickC].name}</div><div class="pv-st">
     <span><em>HP</em> ${hp}</span><span><em>Armor</em> ${CL[pickC].ac}</span>${Object.keys(STATN).map(s=>`<span><em>${s.toUpperCase()}</em> ${sign(st[s])}</span>`).join('')}</div></div>
   <label class="f">Difficulty</label><div class="seg"><button data-d="normal" class="${pickD==='normal'?'sel':''}">Normal<small>Real D&amp;D danger</small></button><button data-d="easy" class="${pickD==='easy'?'sel':''}">Easy<small>Weaker monsters, better aim</small></button></div>
   <div class="choices"><button class="big" id="go">Begin the adventure</button><button class="ghost" id="bk">Back</button></div></article>`;
  $('#hn').oninput=e=>pickN=e.target.value;
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{pickC=b.dataset.k;render()});
  m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{pickR=b.dataset.r;render()});
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{pickD=b.dataset.d;render()});
  $('#bk').onclick=()=>{screen='title';render()};
  $('#go').onclick=()=>{
    const n=(pickN||'').replace(/[^\p{L}\p{N} '\-]/gu,'').trim().slice(0,16)||pick(['Brannoc','Kestrel','Thorne','Zephyr','Rook','Talon','Juno','Ash','Wren','Cassius']);
    const c=CL[pickC];
    S={name:n,cls:pickC,race:pickR,diff:pickD,lvl:1,xp:0,hp,max:hp,ac:c.ac,st:heroStats(pickC,pickR),gold:20,inv:{potion:1,rope:0,luck:pickR==='halfling'?1:0},uses:c.sp.uses,flags:{},kills:{},node:GAME.start,note:'',mode:'story',cp:null};
    pickN='';screen='game';go(GAME.start);
  };
}
render();

</script>
</body>
</html>
